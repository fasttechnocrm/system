<style>
:root,html[data-theme="dark"]{--input-bg:rgba(5,7,15,.6);--aside-bg:rgba(5,7,15,.75);--feat:var(--feat);--star-off:var(--star-off);--track:rgba(255,255,255,.06);--hover:rgba(255,255,255,.015);--pop-shadow:0 20px 60px rgba(0,0,0,.6);--bg:#05070F;--bg-2:#0B1120;--surface-1:rgba(14,20,36,.72);--surface-2:rgba(20,28,48,.85);--cyan:#3FD4FF;--blue:#3A7BFF;--violet:#6C7CFF;--white:#EEF3FB;--muted:#8A97AD;--glass:rgba(255,255,255,.035);--line:rgba(150,170,205,.12);--line-strong:rgba(150,170,205,.22);--grad:linear-gradient(120deg,#5FE0FF,#3A7BFF 60%,#6C7CFF);--ok:#2fd18b;--warn:#ffb547;--bad:#ff5d6c;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);background-image:radial-gradient(900px 500px at 85% -10%,rgba(58,123,255,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(63,212,255,.08),transparent 60%);background-attachment:fixed}
.en{font-family:'Space Grotesk','Cairo',sans-serif}
a{color:var(--cyan)}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--glass);color:var(--white);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px -8px rgba(58,123,255,.6)}
.btn.danger{border-color:rgba(255,93,108,.4);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,select,textarea{width:100%;background:var(--input-bg);border:1px solid var(--line-strong);color:var(--white);border-radius:11px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,212,255,.12)}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
.password-field{position:relative;width:100%}
.password-field input{padding-left:52px}
.password-field .password-toggle{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:40px;height:36px;padding:0;justify-content:center;border:0;background:transparent;color:var(--muted);border-radius:8px}
.password-field .password-toggle:hover{transform:translateY(-50%);color:var(--cyan);background:var(--glass)}
.password-toggle:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.password-toggle svg{width:20px;height:20px;pointer-events:none}
@media(max-width:480px){.modal .form .password-field input{padding-left:52px}}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{width:min(420px,100%);text-align:center}
.login-box img{height:74px;margin-bottom:10px;filter:drop-shadow(0 0 22px rgba(63,212,255,.35))}
.login-box h1{font-size:22px;margin:4px 0 2px}
.login-box form{text-align:start;display:grid;gap:14px;margin-top:22px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.8}
/* layout */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-inline-end:1px solid var(--line);background:var(--aside-bg);backdrop-filter:blur(14px);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
aside .brand img{height:38px}
aside .brand b{font-size:15px;display:block}
aside .brand small{color:var(--muted);font-size:11px}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:4px;cursor:pointer}
nav a:hover{background:var(--glass);color:var(--white)}
nav a.active{background:linear-gradient(120deg,rgba(95,224,255,.14),rgba(58,123,255,.18));color:var(--white);border:1px solid var(--line-strong)}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
main{padding:26px clamp(16px,3vw,36px);overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h2{margin:0;font-size:24px}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat .n{font-size:30px;font-weight:800}
.stat .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:start;font-size:13.5px;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
tr:hover td{background:var(--hover)}
.tbl{overflow-x:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid var(--line-strong);white-space:nowrap}
.b-plan{background:linear-gradient(120deg,rgba(95,224,255,.15),rgba(108,124,255,.2));color:var(--cyan);font-family:'Space Grotesk'}
.b-ok{color:var(--ok);border-color:rgba(47,209,139,.4)}
.b-warn{color:var(--warn);border-color:rgba(255,181,71,.4)}
.b-bad{color:var(--bad);border-color:rgba(255,93,108,.4)}
.b-mut{color:var(--muted)}
.stars{color:#ffc94a;letter-spacing:2px;white-space:nowrap}
.stars span{cursor:pointer}
.stars .off{color:var(--star-off)}
.bar{height:7px;border-radius:9px;background:var(--track);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:170px}
/* plans */
.plans{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.plan{position:relative;display:flex;flex-direction:column}
.plan.featured{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 20px 50px -20px rgba(58,123,255,.5)}
.plan .ic{font-size:30px}
.plan h3{margin:6px 0 0;font-family:'Space Grotesk';font-size:22px;letter-spacing:1px}
.plan .pr{font-size:28px;font-weight:800;margin:10px 0}
.plan .pr small{font-size:13px;color:var(--muted);font-weight:500}
.plan ul{padding:0;padding-inline-start:18px;margin:8px 0 14px;color:var(--feat);font-size:13px;line-height:1.9}
.plan .tag{position:absolute;top:16px;inset-inline-end:16px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,4,10,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg-2);border-color:var(--line-strong)}
.modal h3{margin:0 0 16px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bell{position:relative;font-size:17px;padding:8px 12px}.bell i{position:absolute;top:-6px;left:-6px;background:#ff4d6d;color:#fff;font-style:normal;font-size:11px;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 4px;font-family:'Space Grotesk'}
#npanel{position:fixed;top:70px;left:20px;width:min(400px,calc(100vw - 24px));max-height:75vh;overflow:auto;z-index:60;background:var(--bg-2);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--pop-shadow)}
#npanel .nh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2)}
.ni{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}.ni:hover{background:var(--glass)}.ni.un{background:rgba(63,212,255,.06)}.ni.un b::after{content:" ●";color:var(--cyan);font-size:10px}
.ni .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}.ni p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.6}.ni small{color:var(--muted);font-size:11px}
.note{border-inline-start:3px solid var(--cyan)}.note.un{background:rgba(63,212,255,.05)}
.chip{border:1px solid var(--line-strong);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.lock{font-size:11px;color:var(--warn)}
/* tracker */
.trk th,.trk td{text-align:center;padding:7px 6px}
.trk td.d{text-align:start;white-space:nowrap;font-family:'Space Grotesk'}
.trk tr.fri td{background:rgba(58,123,255,.07)}
.trk tr.target td,.trk tr.done td{font-weight:800;background:rgba(95,224,255,.06)}
.cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);display:inline-grid;place-items:center;cursor:pointer;transition:.15s}
.cb.on{background:var(--grad);border-color:transparent}
.cb.on::after{content:"✓";color:#fff;font-weight:800;font-size:13px}
.trk input.note{padding:5px 8px;font-size:12px;border-radius:8px;min-width:140px}
.trk input.num{width:56px;padding:4px;text-align:center}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ph h3{margin:0;font-size:22px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
.meta b{color:var(--white)}
.toast{position:fixed;bottom:20px;left:20px;background:var(--surface-2);border:1px solid var(--cyan);padding:12px 18px;border-radius:12px;z-index:99;animation:up .3s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.empty{text-align:center;color:var(--muted);padding:30px}
.menu-btn{display:none}
@media (max-width:900px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 0 0 auto;width:260px;z-index:40;transform:translateX(100%);transition:.25s}aside.open{transform:none}.menu-btn{display:inline-flex}.form{grid-template-columns:1fr}}
@media print{aside,.toolbar,.btn,.menu-btn{display:none!important}#app{display:block}body{background:#fff;color:#000}.card{border:1px solid #ccc;background:#fff}}

/* ===== Light theme (same tokens as fasttechnoagency.com) ===== */
html[data-theme="light"]{--bg:#F6F8FC;--bg-2:#FFFFFF;--surface-1:rgba(255,255,255,.8);--surface-2:#FFFFFF;--cyan:#0A84D6;--blue:#1F5FE0;--violet:#4B5CE6;--white:#0B1530;--muted:#55627A;--glass:rgba(255,255,255,.7);--line:rgba(20,40,90,.09);--line-strong:rgba(20,40,90,.16);--grad:linear-gradient(120deg,#0A9BE0,#1F5FE0 60%,#4B5CE6);--ok:#12a86b;--warn:#d98a0b;--bad:#e23a4b;--input-bg:#fff;--aside-bg:rgba(255,255,255,.85);--feat:#34425c;--star-off:#cfd6e3;--track:rgba(20,40,90,.08);--hover:rgba(20,40,90,.025);--pop-shadow:0 20px 60px rgba(20,40,90,.18)}
html[data-theme="light"] body{background-image:radial-gradient(900px 500px at 85% -10%,rgba(31,95,224,.10),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(10,155,224,.06),transparent 60%)}
html[data-theme="light"] .modal{background:rgba(11,21,48,.35)}
html[data-theme="light"] .card{box-shadow:0 30px 70px -40px rgba(31,95,224,.35)}
body{transition:background-color .3s,color .3s}
.card,aside,input,select,textarea,.btn,#npanel{transition:background-color .3s,color .3s,border-color .3s}
/* LTR (English) */
html[dir="ltr"] .login-box form{text-align:left}
@media (max-width:900px){html[dir="ltr"] aside{inset:0 auto 0 0;transform:translateX(-100%)}html[dir="ltr"] aside.open{transform:none}}
html[dir="ltr"] #live{left:auto!important;right:14px}html[dir="ltr"] #npanel{left:auto;right:20px}
html[dir="ltr"] body{font-family:'Space Grotesk','Cairo',sans-serif}
/* ===== Theme + language switches (copied from fasttechnoagency.com) ===== */
.prefs{display:inline-flex;gap:8px;align-items:center}
#loginPrefs{position:fixed;top:16px;inset-inline-end:16px;z-index:45}
.icon-btn{font-family:"Segoe UI Symbol","DejaVu Sans",system-ui,sans-serif!important;line-height:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--glass);color:var(--white);cursor:pointer;font-size:16px;padding:0}
.lang-switch{direction:ltr;position:relative;display:inline-flex;align-items:center;gap:0;padding:3px;border-radius:999px;border:1px solid rgba(124,92,255,.45);background:rgba(10,14,40,.6);box-shadow:0 0 18px rgba(60,140,255,.25),inset 0 0 12px rgba(124,92,255,.2);cursor:pointer;font:600 13px/1 'Space Grotesk','Cairo',sans-serif;color:#cfe3ff;isolation:isolate;flex:none;white-space:nowrap}
.lang-switch span{position:relative;z-index:1;padding:8px 12px;border-radius:999px;transition:color .4s;min-width:2.4em;text-align:center}
.lang-switch::before{content:"";position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,#2f7bff,#8a4dff);box-shadow:0 0 16px rgba(120,90,255,.7);transition:transform .6s cubic-bezier(.7,-.4,.3,1.4)}
html[lang="ar"] .lang-switch::before{transform:translateX(100%)}
.lang-switch span.on{color:#fff}
.lang-switch:focus-visible{outline:2px solid #5aa2ff;outline-offset:3px}
html[data-theme="light"] .lang-switch{background:var(--surface-2);border-color:var(--line-strong);color:var(--white)}
html[data-theme="light"] .lang-switch span.on{color:#fff}
#langFx{position:fixed;inset:0;z-index:9999;pointer-events:none;visibility:hidden;perspective:1200px}
#langFx .pane{position:absolute;top:0;bottom:0;width:20.2%;background:linear-gradient(180deg,#060a22,#120a35);transform-origin:center;transform:rotateY(90deg);box-shadow:inset 0 0 40px rgba(90,140,255,.35);border-inline:1px solid rgba(120,160,255,.35)}
#langFx .pane::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(120,180,255,.08) 0 2px,transparent 2px 5px)}
#langFx .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;font:700 clamp(34px,11vw,96px)/1 'Space Grotesk','Cairo',sans-serif;color:#fff;text-shadow:0 0 20px #3b8cff,0 0 50px #8a4dff;width:90vw}
#langFx .core small{display:block;margin-top:14px;font-size:clamp(10px,2.8vw,14px);letter-spacing:.3em;color:#8fc0ff;text-shadow:none;font-weight:500}
#langFx .ring{position:absolute;left:50%;top:50%;width:min(260px,62vw);height:min(260px,62vw);margin:calc(min(260px,62vw) / -2);border-radius:50%;border:2px solid transparent;border-top-color:#3b8cff;border-bottom-color:#8a4dff;opacity:0;filter:drop-shadow(0 0 12px #5a7bff)}
#langFx .scan{position:absolute;left:0;right:0;height:3px;top:0;background:linear-gradient(90deg,transparent,#6fb6ff,#b07bff,transparent);box-shadow:0 0 20px #6fb6ff;opacity:0}
#langFx.run{visibility:visible}
#langFx.run .pane{animation:paneIn 1.5s cubic-bezier(.77,0,.18,1) both}
#langFx.run .core{animation:coreIn 1.5s ease both}
#langFx.run .ring{animation:ringSpin 1.5s ease both}
#langFx.run .scan{animation:scanY 1.5s ease both}
@keyframes paneIn{0%{transform:rotateY(90deg)}35%,62%{transform:rotateY(0)}100%{transform:rotateY(-90deg)}}
@keyframes coreIn{0%,25%{opacity:0;transform:translate(-50%,-50%) scale(.6);filter:blur(8px)}42%,58%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}75%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.4);filter:blur(10px)}}
@keyframes ringSpin{0%,20%{opacity:0;transform:rotate(0) scale(.5)}45%,60%{opacity:1}80%,100%{opacity:0;transform:rotate(540deg) scale(1.6)}}
@keyframes scanY{0%,30%{opacity:0;top:0}40%{opacity:1}65%{opacity:1;top:100%}70%,100%{opacity:0;top:100%}}
#app,#login{transition:filter .5s}
html.lang-busy #app,html.lang-busy #login{filter:blur(6px) saturate(1.6)}
.lang-glitch{animation:langGlitch .7s steps(2) both}
@keyframes langGlitch{0%{opacity:0;clip-path:inset(0 0 100% 0);text-shadow:-3px 0 #3b8cff,3px 0 #8a4dff}50%{opacity:1;clip-path:inset(0 0 40% 0);text-shadow:2px 0 #3b8cff,-2px 0 #8a4dff}100%{clip-path:inset(0);text-shadow:none}}
@media (prefers-reduced-motion:reduce){#langFx{display:none}.lang-glitch{animation:none}}
@media (max-width:480px){.lang-switch{font-size:11px;padding:2px}.lang-switch::before{top:2px;bottom:2px;left:2px;width:calc(50% - 2px)}.lang-switch span{padding:6px 7px;min-width:2.1em}.icon-btn{width:36px;height:36px}}
@media print{.prefs,#loginPrefs{display:none!important}}
html[data-theme="light"] option{background:#fff;color:#0B1530}
@media(max-width:480px){.modal .form{gap:10px}.modal .actions{margin-top:10px}.modal h3{margin-bottom:12px}.modal .card{max-height:calc(100dvh - 32px);padding:16px}.modal .form input,.modal .form select{padding:8px 10px}}
</style>
</head>

const EN_RE=new RegExp("(?<![\\u0621-\\u064A])("+EN_KEYS.join("|")+")(?![\\u0621-\\u064A])","g");
const trS=s=>s&&/[\u0600-\u06FF]/.test(s)?s.replace(EN_RE,m=>EN[m]).replace(/ {2,}/g," "):s;

async function save(scope={meta:true}){if(!TOK)return;try{const r=await rpc("ft_save",{p_token:TOK,p_data:DB,p_scope:scope});if(apply(r)&&scope.meta)rerender()}catch(e){toast("تعذّر الاتصال، لم يتم الحفظ");refresh(true)}}
async function load(){}
function busy(){const a=document.activeElement;return $("#modalRoot").innerHTML!==""||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.closest("#login"))}
function rerender(){if(!ME)return;const y=window.scrollY;$("#meName").textContent=ME.name;$("#meRole").textContent=FTHierarchy.roles[ME.role]||ME.title;buildNav();const h=location.hash.slice(1)||"dashboard";const [pg,arg]=h.split("/");if(!FTHierarchy.canManageTeam(ME)&&pg==="team")return go("dashboard");document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("active",x.dataset.k===pg));(VIEWS[pg]||VIEWS.dashboard)(arg);window.scrollTo(0,y)}
async function refresh(force){if(!TOK)return;let r;try{r=await rpc("ft_get",{p_token:TOK});setLive(true)}catch(e){return}if(r.disabled)return kicked();if(!force&&r.version===VER)return;const wasRole=ME&&ME.role;apply(r);if(!ME)return kicked();if(wasRole&&wasRole!==ME.role){closeModal();toast("تم تحديث صلاحياتك")}if(busy()){PENDING=true;return}rerender()}
SB.channel("ft-sync").on("broadcast",{event:"changed"},m=>{if(m.payload?.v!==VER)refresh()}).on("broadcast",{event:"inbox"},m=>{const u=m.payload?.u;if(ME&&(!u||u.includes(ME.id)))loadInbox(true)}).subscribe(st=>{setLive(st==="SUBSCRIBED");if(st==="SUBSCRIBED")refresh()});
setInterval(()=>{refresh();loadInbox()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
document.addEventListener("focusout",()=>setTimeout(()=>{if(PENDING&&!busy()){PENDING=false;rerender()}},300));
let ME=null;
const isAdmin=()=>ME&&ME.role==="admin";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const today=()=>new Date().toISOString().slice(0,10);
const daysLeft=d=>Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
const planOf=n=>PLANS.items.find(p=>p.name===n);
function stars(v,pid){let h="";for(let i=1;i<=5;i++)h+=`<span class="${i<=v?"":"off"}" ${pid&&isAdmin()?`onclick="setRating('${pid}',${i})"`:""}>★</span>`;return `<span class="stars">${h}</span>`}
function visibleProjects(){return isAdmin()?DB.projects:DB.projects.filter(p=>p.members.includes(ME.id))}
function dateRange(a,b){const r=[];if(!a||!b)return r;let d=new Date(a+"T00:00:00"),e=new Date(b+"T00:00:00");while(d<=e&&r.length<400){r.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return r}
function progress(p){const t=DB.tracker[p.id]||{};let done=0,tgt=0;TASKS.forEach(([k])=>{tgt+=+(p.targets?.[k]||0);done+=Math.min(countDone(t,k),+(p.targets?.[k]||0))});return tgt?Math.round(done/tgt*100):0}
function countDone(t,k){return Object.values(t).filter(r=>r&&r[k]).length}
function deadlineBadge(p){if(p.status==="completed")return `<span class="badge b-mut">مكتمل</span>`;if(!p.deadline)return "—";const n=daysLeft(p.deadline);return n<0?`<span class="badge b-bad">متأخر ${-n} يوم</span>`:n<=5?`<span class="badge b-warn">${n} يوم متبقي</span>`:`<span class="badge b-ok">${n} يوم متبقي</span>`}

$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";const u=$("#lu").value.trim().toLowerCase(),h=await sha($("#lp").value);let r;try{r=await rpc("ft_login",{p_username:u,p_hash:h})}catch(x){$("#lerr").textContent="تعذّر الاتصال بالخادم، تحقق من الإنترنت";return}if(r.error){$("#lerr").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";return}TOK=r.token;sessionStorage.setItem("ft_tok",TOK);apply(r);await refresh(true);start()};

function start(){if(!DB)return;ME=DB.users.find(u=>u.id===sessionStorage.getItem("ft_sess"));if(!ME)return;$("#login").classList.add("hidden");$("#loginPrefs").classList.add("hidden");$("#app").classList.remove("hidden");$("#meName").textContent=ME.name;$("#meRole").textContent=FTHierarchy.roles[ME.role]||ME.title;$("#meAv").textContent=ME.name.trim()[0]||"؟";buildNav();go(location.hash.slice(1)||"dashboard");loadInbox()}

function buildNav(){const items=[["dashboard","◈","لوحة التحكم"],["projects","▤","المشاريع"],["plans","✦","الباقات"]];if(isAdmin())items.push(["team","◉","الموظفون"],["ratings","★","التقييم"],["notes","✉","الملاحظات"],["settings","⚙","الإعدادات"]);else items.push(["ratings","★","تقييمي"],["notes","✉","ملاحظاتي"],["settings","⚙","حسابي"]);if(!isAdmin()&&FTHierarchy.canManageTeam(ME))items.splice(3,0,["team","◉","الموظفون"]);$("#nav").innerHTML=items.map(([k,i,t])=>`<a data-k="${k}" onclick="go('${k}')"><span>${i}</span>${t}</a>`).join("")}
function go(v){if(location.hash.slice(1)!==v){location.hash=v;$("#side").classList.remove("open");return}const [page,arg]=v.split("/");document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.k===page));$("#side").classList.remove("open");(VIEWS[page]||VIEWS.dashboard)(arg);window.scrollTo(0,0)}

  </div>

  </div>`;

/* ===== Employee follow-up & task ratings ===== */
const TNAME=k=>(TASKS.find(t=>t[0]===k)||[])[1]||k;
function doneTasks(uid){const out=[];visibleProjects().forEach(p=>{const t=DB.tracker[p.id]||{};Object.entries(t).forEach(([d,r])=>{if(!r)return;TASKS.forEach(([k])=>{if(r[k]&&r.by?.[k]&&(!uid||r.by[k]===uid)){const rt=(p.taskRatings||{})[d+"|"+k]||{};out.push({p,d,k,by:r.by[k],at:r.at?.[k],s:rt.s||0,c:rt.c||"",note:r.note||""})}})})});return out.sort((a,b)=>(b.d+(b.at||"")).localeCompare(a.d+(a.at||"")))}
function avgOf(l){const r=l.filter(x=>x.s);return r.length?(r.reduce((a,x)=>a+x.s,0)/r.length).toFixed(1):"—"}
function tStars(x,edit){let h="";for(let i=1;i<=5;i++)h+=`<span class="${i<=x.s?"":"off"}" ${edit?`onclick="rateTask('${x.p.id}','${x.d}','${x.k}',${i})" title="${i}"`:""}>★</span>`;return `<span class="stars">${h}</span>`}
function rateTask(pid,d,k,v){if(!isAdmin())return;const p=DB.projects.find(x=>x.id===pid);p.taskRatings=p.taskRatings||{};const key=d+"|"+k,o=p.taskRatings[key]||{};if(o.s===v)delete o.s;else{o.s=v;o.by=ME.id;o.at=new Date().toISOString()}if(!o.s&&!o.c)delete p.taskRatings[key];else p.taskRatings[key]=o;save();toast("تم حفظ التقييم ✓");const who=DB.tracker[pid]?.[d]?.by?.[k];if(who&&o.s){const tn=TASKS.find(x=>x[0]===k);notify([who],"rate","⭐ تم تقييم مهمتك "+o.s+"/5","مهمة "+tn[2]+" في مشروع "+p.client+" — يوم "+d,"ratings")}}
function commentTask(pid,d,k){if(!isAdmin())return;const p=DB.projects.find(x=>x.id===pid);p.taskRatings=p.taskRatings||{};const key=d+"|"+k,o=p.taskRatings[key]||{};const c=prompt("ملاحظة المدير على هذه المهمة:",o.c||"");if(c===null)return;o.c=c.trim();if(!o.s&&!o.c)delete p.taskRatings[key];else p.taskRatings[key]=o;save();toast("تم حفظ الملاحظة ✓");const who=DB.tracker[pid]?.[d]?.by?.[k];if(who&&o.c){const tn=TASKS.find(x=>x[0]===k);notify([who],"rate","💬 ملاحظة المدير على مهمتك",tn[2]+" — "+p.client+": "+o.c,"ratings")}}
function uName(id){return DB.users.find(u=>u.id===id)?.name||"(محذوف)"}
function fmtAt(a){return a?new Date(a).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—"}
function taskTable(l,showEmp){if(!l.length)return `<div class="empty">لا توجد مهام منجزة بعد</div>`;const ed=isAdmin();return `<table><thead><tr><th>التاريخ</th><th>المشروع</th><th>المهمة</th>${showEmp?"<th>الموظف</th>":""}<th>الحالة</th><th>وقت الإنجاز</th><th>التقييم</th><th>ملاحظة المدير</th></tr></thead><tbody>${l.map(x=>`<tr><td class="en">${fmt(x.d)}</td><td><a style="color:var(--white);font-weight:700;cursor:pointer" onclick="go('projects/${x.p.id}')">${esc(x.p.client)}</a></td><td><span class="badge b-plan en">${TNAME(x.k)}</span></td>${showEmp?`<td>${ed?`<a style="cursor:pointer;color:var(--white)" onclick="go('team/${x.by}')">${esc(uName(x.by))}</a>`:esc(uName(x.by))}</td>`:""}<td><span class="badge b-ok">✓ مكتملة</span></td><td class="en" style="font-size:12px">${fmtAt(x.at)}</td><td style="white-space:nowrap">${tStars(x,ed)} ${x.s?"":`<small style="color:var(--warn)">${ed?"بانتظار تقييمك":"لم تُقيَّم بعد"}</small>`}</td><td style="font-size:12px;max-width:220px">${esc(x.c)||"—"} ${ed?`<button class="btn sm" onclick="commentTask('${x.p.id}','${x.d}','${x.k}')">✎</button>`:""}</td></tr>`).join("")}</tbody></table>`}
function statCards(l,extra=""){const rated=l.filter(x=>x.s);return `<div class="grid stats"><div class="card stat"><div class="n grad-text">${l.length}</div><div class="l">مهام مكتملة</div></div><div class="card stat"><div class="n" style="color:#ffc94a">${avgOf(l)} ★</div><div class="l">متوسط التقييم</div></div><div class="card stat"><div class="n" style="color:var(--ok)">${rated.length}</div><div class="l">مهام مُقيَّمة</div></div><div class="card stat"><div class="n" style="color:var(--warn)">${l.length-rated.length}</div><div class="l">بانتظار التقييم</div></div>${extra}</div>`}
function filterBar(id,emp){return `<div class="toolbar">${emp?`<select id="${id}e"><option value="">كل الموظفين</option>${DB.users.filter(u=>u.role!=="admin").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select>`:""}<select id="${id}p"><option value="">كل المشاريع</option>${visibleProjects().map(p=>`<option value="${p.id}">${esc(p.client)}</option>`).join("")}</select><select id="${id}k"><option value="">كل المهام</option>${TASKS.map(([k,e])=>`<option value="${k}">${e}</option>`).join("")}</select><select id="${id}s"><option value="">الكل</option><option value="no">بانتظار التقييم</option><option value="yes">مُقيَّمة</option></select></div>`}
function bindFilter(id,base,showEmp){const f=()=>{const e=$("#"+id+"e")?.value,p=$("#"+id+"p").value,k=$("#"+id+"k").value,s=$("#"+id+"s").value;$("#"+id+"t").innerHTML=taskTable(base.filter(x=>(!e||x.by===e)&&(!p||x.p.id===p)&&(!k||x.k===k)&&(!s||(s==="no"?!x.s:x.s))),showEmp)};["e","p","k","s"].forEach(c=>{const el=$("#"+id+c);if(el)el.onchange=f});f()}
function ratingsView(){
  const ad=isAdmin(),l=doneTasks(ad?null:ME.id);
  if(ad){
    const emps=DB.users.filter(u=>u.role!=="admin");
    $("#main").innerHTML=header("التقييم","قيّم كل مهمة أنجزها الموظفون")+statCards(l)+
    `<div class="card tbl" style="margin-top:16px"><h3 style="margin:0 0 10px">ترتيب الموظفين</h3><table><thead><tr><th>الموظف</th><th>مهام مكتملة</th><th>مُقيَّمة</th><th>بانتظار التقييم</th><th>متوسط التقييم</th><th></th></tr></thead><tbody>${emps.map(u=>{const m=l.filter(x=>x.by===u.id);return {u,m,a:avgOf(m)}}).sort((a,b)=>(parseFloat(b.a)||0)-(parseFloat(a.a)||0)).map(({u,m,a})=>`<tr><td><b>${esc(u.name)}</b></td><td>${m.length}</td><td>${m.filter(x=>x.s).length}</td><td style="color:var(--warn)">${m.filter(x=>!x.s).length}</td><td style="color:#ffc94a">${a} ★</td><td><button class="btn sm primary" onclick="go('team/${u.id}')">التفاصيل</button></td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">لا يوجد موظفون</div></td></tr>`}</tbody></table></div>
    <div class="card" style="margin-top:16px"><h3 style="margin:0 0 10px">كل المهام المنجزة</h3>${filterBar("rf",true)}<div class="tbl" id="rft"></div></div>`;
    bindFilter("rf",l,true);
  }else{
    $("#main").innerHTML=header("تقييمي","تقييم المدير لكل مهمة أنجزتها")+statCards(l)+
    `<div class="card" style="margin-top:16px"><h3 style="margin:0 0 10px">مهامي المنجزة وتقييمها</h3>${filterBar("rf",false)}<div class="tbl" id="rft"></div></div>`;
    bindFilter("rf",l,false);
  }
}
function empView(uid){
  const u=DB.users.find(x=>x.id===uid);if(!u||!FTHierarchy.canManage(ME,u))return go("team");
  const ps=DB.projects.filter(p=>p.members.includes(uid)),l=doneTasks(uid),t=today();

  `<div class="card tbl" style="margin-top:16px"><h3 style="margin:0 0 10px">إنجازه في كل مشروع</h3>${ps.length?`<table><thead><tr><th>المشروع</th><th>الباقة</th><th>Deadline</th>${TASKS.map(([k,e])=>`<th>${e}</th>`).join("")}<th>إجمالي إنجازه</th><th>متوسط تقييمه</th><th>تقدم المشروع</th></tr></thead><tbody>${ps.map(p=>{const m=l.filter(x=>x.p.id===p.id);const pr=progress(p);return `<tr><td><a style="color:var(--white);font-weight:700;cursor:pointer" onclick="go('projects/${p.id}')">${esc(p.client)}</a></td><td><span class="badge b-plan">${p.plan}</span></td><td>${deadlineBadge(p)}</td>${TASKS.map(([k])=>`<td class="en">${m.filter(x=>x.k===k).length} <small style="color:var(--muted)">/ ${p.targets?.[k]||0}</small></td>`).join("")}<td><b>${m.length}</b></td><td style="color:#ffc94a">${avgOf(m)} ★</td><td><div style="display:flex;gap:8px;align-items:center;min-width:110px"><div class="bar" style="flex:1"><i style="width:${pr}%"></i></div><small class="en">${pr}%</small></div></td></tr>`}).join("")}</tbody></table>`:`<div class="empty">لا توجد مشاريع مسندة لهذا الموظف</div>`}</div>
  <div class="card" style="margin-top:16px"><h3 style="margin:0 0 10px">سجل المهام المنجزة والتقييم</h3>${filterBar("ef",false)}<div class="tbl" id="eft"></div></div>`;
  bindFilter("ef",l,false);
}

function projTable(ps,compact){
  if(!ps.length)return `<div class="empty">لا توجد مشاريع${isAdmin()?"":" مسندة إليك بعد"}</div>`;
  return `<table><thead><tr><th>#</th><th>العميل</th><th>الباقة</th>${compact?"":"<th>البداية</th><th>النهاية</th>"}<th>Deadline</th>${compact?"":"<th>الفريق</th>"}<th>الإنجاز</th><th>التقييم</th>${compact?"":"<th>الحالة</th><th></th>"}</tr></thead><tbody>${ps.map((p,i)=>{const pr=progress(p);return `<tr><td class="en" style="color:var(--muted)">${String(i+1).padStart(2,"0")}</td><td><a style="color:var(--white);font-weight:700;cursor:pointer;text-decoration:none" onclick="go('projects/${p.id}')">${esc(p.client)}</a></td><td><span class="badge b-plan">${p.plan}</span></td>${compact?"":`<td class="en">${fmt(p.start)}</td><td class="en">${fmt(p.end)}</td>`}<td>${deadlineBadge(p)}</td>${compact?"":`<td style="font-size:12px">${p.members.map(m=>esc(DB.users.find(u=>u.id===m)?.name||"")).filter(Boolean).join("، ")||"—"}</td>`}<td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:${pr}%"></i></div><small class="en">${pr}%</small></div></td><td>${stars(p.rating,compact?null:p.id)}</td>${compact?"":`<td><span class="badge ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span></td><td style="white-space:nowrap"><button class="btn sm" onclick="go('projects/${p.id}')">المتابعة</button> ${isAdmin()?`<button class="btn sm" onclick="projectModal('${p.id}')">تعديل</button> <button class="btn sm danger" onclick="delProject('${p.id}')">حذف</button>`:""}</td>`}</tr>`}).join("")}</tbody></table>`;
}
function setRating(id,v){if(!isAdmin())return;const p=DB.projects.find(x=>x.id===id);p.rating=p.rating===v?0:v;save();go(location.hash.slice(1));toast("تم حفظ التقييم")}

/* ===== Tracker (daily) ===== */
function trackerView(id){
  const p=DB.projects.find(x=>x.id===id);if(!p||(!isAdmin()&&!p.members.includes(ME.id)))return go("projects");
  const t=DB.tracker[p.id]||(DB.tracker[p.id]={});const days=dateRange(p.start,p.end);const pl=planOf(p.plan);
  const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  $("#main").innerHTML=header(esc(p.client),"المتابعة اليومية للمهام",`<button class="btn" onclick="go('projects')">→ رجوع</button><button class="btn" onclick="window.print()">🖨 طباعة</button>${isAdmin()?`<button class="btn primary" onclick="projectModal('${p.id}')">تعديل المشروع</button>`:""}`)+
  `<div class="card" style="margin-bottom:16px"><div class="ph"><div><h3>${esc(p.client)} <span class="badge b-plan" style="vertical-align:middle">${pl?.icon||""} ${p.plan}</span></h3><div class="meta"><span>البداية: <b class="en">${fmt(p.start)}</b></span><span>النهاية: <b class="en">${fmt(p.end)}</b></span><span>Deadline: <b class="en">${fmt(p.deadline)}</b> ${deadlineBadge(p)}</span><span>الباقة: <b class="en">${pl?.price||""}</b></span><span>الحالة: <span class="badge ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span></span></div><div class="meta"><span>الفريق: <b>${p.members.map(m=>esc(DB.users.find(u=>u.id===m)?.name||"")).filter(Boolean).join("، ")||"—"}</b></span><span>التقييم: ${stars(p.rating,p.id)}</span></div>${p.notes?`<p style="color:var(--feat);font-size:13px;margin:10px 0 0">📝 ${esc(p.notes)}</p>`:""}</div><div style="min-width:200px"><div style="font-size:13px;color:var(--muted)">الإنجاز الكلي</div><div style="font-size:34px;font-weight:800" class="grad-text en">${progress(p)}%</div><div class="bar"><i style="width:${progress(p)}%"></i></div></div></div></div>
  <div class="card tbl"><table class="trk"><thead><tr><th style="text-align:start">التاريخ</th><th>اليوم</th>${TASKS.map(([k,e])=>`<th>${e}</th>`).join("")}<th style="text-align:start">ملاحظات</th></tr></thead><tbody>
   <tr class="target"><td class="d">Monthly target</td><td></td>${TASKS.map(([k])=>`<td>${isAdmin()?`<input class="num" type="number" min="0" value="${p.targets?.[k]||0}" onchange="setTarget('${p.id}','${k}',this.value)">`:(p.targets?.[k]||0)}</td>`).join("")}<td style="text-align:start;font-size:12px;color:var(--muted)">حسب باقة ${p.plan}</td></tr>
   ${days.map(d=>{const dt=new Date(d+"T00:00:00"),r=t[d]||{},fut=d>today();return `<tr class="${dt.getDay()===5?"fri":""}"><td class="d">${dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</td><td class="en" style="color:var(--muted)">${dn[dt.getDay()]}</td>${TASKS.map(([k])=>`<td><span class="cb ${r[k]?"on":""}" title="${r.by?.[k]?esc(DB.users.find(u=>u.id===r.by[k])?.name||""):""}" onclick="tick('${p.id}','${d}','${k}',this)"></span></td>`).join("")}<td><input class="note" value="${esc(r.note||"")}" placeholder="${fut?"":"—"}" onchange="setNote('${p.id}','${d}',this.value)"></td></tr>`}).join("")}
   <tr class="done"><td class="d">Done</td><td></td>${TASKS.map(([k])=>{const c=countDone(t,k),g=+(p.targets?.[k]||0);return `<td id="dn-${k}" style="color:${c>=g&&g?"var(--ok)":"inherit"}">${c} / ${g}</td>`}).join("")}<td></td></tr>
  </tbody></table>${!days.length?`<div class="empty">حدد تاريخ البدء والانتهاء للمشروع لعرض جدول المتابعة</div>`:""}</div>`;
}
function tick(pid,d,k,el){const t=DB.tracker[pid]||(DB.tracker[pid]={});const r=t[d]||(t[d]={});r[k]=!r[k];r.by=r.by||{};r.at=r.at||{};if(r[k]){r.by[k]=ME.id;r.at[k]=new Date().toISOString()}else{delete r.by[k];delete r.at[k]}save({tracker:[pid]});{const pp=DB.projects.find(x=>x.id===pid),tn=TASKS.find(x=>x[0]===k);notify(null,r[k]?"done":"undo",(r[k]?"✅ أنجز ":"↩ ألغى إنجاز ")+ME.name+" مهمة "+tn[2]+" ("+tn[1]+")","المشروع: "+(pp?.client||"")+" — يوم "+d,"projects/"+pid)}el.classList.toggle("on",r[k]);const p=DB.projects.find(x=>x.id===pid);const c=countDone(t,k),g=+(p.targets?.[k]||0);const td=document.getElementById("dn-"+k);td.textContent=`${c} / ${g}`;td.style.color=c>=g&&g?"var(--ok)":"inherit"}
function setNote(pid,d,v){const t=DB.tracker[pid]||(DB.tracker[pid]={});(t[d]||(t[d]={})).note=v;save({tracker:[pid]});{const pp=DB.projects.find(x=>x.id===pid);notify(null,"edit","📝 "+ME.name+" أضاف ملاحظة يومية","المشروع: "+(pp?.client||"")+" — "+d+": "+v,"projects/"+pid)}toast("تم حفظ الملاحظة")}
function setTarget(pid,k,v){const p=DB.projects.find(x=>x.id===pid);p.targets[k]=Math.max(0,+v||0);save();go("projects/"+pid)}

/* ===== Notifications & Notes ===== */
let INBOX={notifs:[],notes:[]};
const UNREAD=()=>INBOX.notifs.filter(n=>!n.is_read).length;
const ago=t=>{const s=(Date.now()-new Date(t))/1e3;return s<60?"الآن":s<3600?`قبل ${Math.floor(s/60)} د`:s<86400?`قبل ${Math.floor(s/3600)} س`:new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
const NIC={done:"✅",undo:"↩",edit:"📝",rate:"⭐",task:"📌",note:"✉",read:"👁",info:"🔔"};
async function notify(to,kind,title,body,link){if(!TOK)return;try{await rpc("ft_notify",{p_token:TOK,p_to:to,p_kind:kind,p_title:title,p_body:body||"",p_link:link||""})}catch(e){}}
async function loadInbox(live){if(!TOK)return;let r;try{r=await rpc("ft_inbox",{p_token:TOK})}catch(e){return}if(r.disabled)return kicked();const before=new Set(INBOX.notifs.map(n=>n.id)),fresh=r.notifs.filter(n=>!n.is_read&&!before.has(n.id));const first=!INBOX._l;INBOX=r;INBOX._l=1;paintBell();if(live&&!first&&fresh.length){toast("🔔 "+fresh[0].title);try{new AudioContext().resume()}catch(e){}}if(!$("#npanel").classList.contains("hidden"))renderPanel();if(location.hash.slice(1).split("/")[0]==="notes"&&!busy())VIEWS.notes()}
function paintBell(){const n=UNREAD();document.querySelectorAll(".nbadge").forEach(b=>{b.textContent=n>99?"99+":n;b.style.display=n?"":"none"});document.title=(n?`(${n}) `:"")+"Fast Techno · DM System"}
function togglePanel(e){e&&e.stopPropagation();const p=$("#npanel");p.classList.toggle("hidden");if(!p.classList.contains("hidden"))renderPanel()}
document.addEventListener("click",e=>{const p=$("#npanel");if(p&&!p.classList.contains("hidden")&&!p.contains(e.target)&&!e.target.closest(".bell"))p.classList.add("hidden")});
function renderPanel(){const L=INBOX.notifs;$("#npanel").innerHTML=`<div class="nh"><b>الإشعارات ${UNREAD()?`<span class="badge b-warn">${UNREAD()} جديد</span>`:""}</b><div style="display:flex;gap:6px"><button class="btn sm" onclick="readAll()">تعليم الكل كمقروء</button><button class="btn sm" onclick="clearN()" title="مسح الكل">🗑</button></div></div>`+(L.length?L.map(n=>`<div class="ni ${n.is_read?"":"un"}" onclick="openN(${n.id})"><div class="ic">${NIC[n.kind]||"🔔"}</div><div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(n.title)}</b>${n.body?`<p>${esc(n.body)}</p>`:""}<small class="en">${ago(n.created_at)}</small></div></div>`).join(""):`<p style="text-align:center;color:var(--muted);padding:30px">لا توجد إشعارات</p>`)}
async function openN(id){const n=INBOX.notifs.find(x=>x.id===id);if(!n)return;if(!n.is_read){n.is_read=true;paintBell();renderPanel();rpc("ft_read",{p_token:TOK,p_ids:[id],p_note:null}).catch(()=>{})}if(n.link){$("#npanel").classList.add("hidden");go(n.link)}}
async function readAll(){INBOX.notifs.forEach(n=>n.is_read=true);paintBell();renderPanel();try{await rpc("ft_read",{p_token:TOK,p_ids:null,p_note:null})}catch(e){}}
async function clearN(){if(!confirm("مسح كل الإشعارات؟"))return;INBOX.notifs=[];paintBell();renderPanel();try{await rpc("ft_notif_clear",{p_token:TOK})}catch(e){}}
const uname=id=>DB.users.find(u=>u.id===id)?.name||"(محذوف)";
VIEWS.notes=function(){const adm=isAdmin(),N=INBOX.notes;
 const list=N.length?N.map(n=>{const rd=n.read_by||[],un=!adm&&!rd.includes(ME.id);return `<div class="card note ${un?"un":""}" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:15px">${esc(n.title)}</b> ${un?'<span class="badge b-warn">جديدة</span>':""}<div style="color:var(--muted);font-size:12px;margin-top:4px">${adm?"إلى: "+n.to_ids.map(i=>`<span class="badge ${rd.includes(i)?"b-ok":"b-mut"}" title="${rd.includes(i)?"قرأها":"لم يقرأها بعد"}">${rd.includes(i)?"✓ ":""}${esc(uname(i))}</span>`).join(" "):"من: "+esc(uname(n.from_id))} · <span class="en">${ago(n.created_at)}</span></div></div><div style="display:flex;gap:6px">${un?`<button class="btn sm primary" onclick="readNote(${n.id})">تم الاطلاع ✓</button>`:""}${adm?`<button class="btn sm" onclick="delNote(${n.id})">حذف</button>`:""}</div></div><p style="white-space:pre-wrap;line-height:1.9;margin:12px 0 0">${esc(n.body)}</p></div>`}).join(""):`<div class="card" style="text-align:center;color:var(--muted)">لا توجد ملاحظات بعد</div>`;
 $("#main").innerHTML=header(adm?"الملاحظات":"ملاحظاتي",adm?"أرسل ملاحظات للموظفين وتابع من قرأها":"الملاحظات المرسلة إليك من الإدارة",adm?`<button class="btn primary" onclick="noteModal()">＋ ملاحظة جديدة</button>`:"")+list};
function noteModal(){const emps=DB.users.filter(u=>u.id!==ME.id);modal(`<h3 style="margin-top:0">إرسال ملاحظة</h3><div class="full" style="margin-bottom:12px"><label>إلى الموظفين</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px" id="nto"><span class="chip" onclick="document.querySelectorAll('#nto .chip[data-id]').forEach(c=>c.classList.add('on'))">الكل</span>${emps.map(u=>`<span class="chip" data-id="${u.id}" onclick="this.classList.toggle('on')">${esc(u.name)}</span>`).join("")}</div></div><label>العنوان</label><input id="ntt" maxlength="150" style="width:100%;margin:6px 0 12px"><label>نص الملاحظة</label><textarea id="ntb" rows="6" style="width:100%;margin-top:6px"></textarea><p id="nerr" style="color:#ff6b6b;min-height:18px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="sendNote()">إرسال</button></div>`)}
async function sendNote(){const to=[...document.querySelectorAll("#nto .chip.on[data-id]")].map(c=>c.dataset.id),t=$("#ntt").value.trim(),b=$("#ntb").value.trim();if(!to.length)return $("#nerr").textContent="اختر موظفاً واحداً على الأقل";if(!t||!b)return $("#nerr").textContent="يرجى كتابة العنوان ونص الملاحظة";try{const r=await rpc("ft_note_send",{p_token:TOK,p_to:to,p_title:t,p_body:b});if(r.error)throw 0;closeModal();toast("تم إرسال الملاحظة ✓");loadInbox()}catch(e){$("#nerr").textContent="تعذّر الإرسال"}}
async function delNote(id){if(!confirm("حذف هذه الملاحظة؟"))return;try{await rpc("ft_note_del",{p_token:TOK,p_id:id})}catch(e){}loadInbox()}
async function readNote(id){const n=INBOX.notes.find(x=>x.id===id);try{await rpc("ft_read",{p_token:TOK,p_ids:null,p_note:id})}catch(e){}notify(null,"read","👁 "+ME.name+" اطّلع على الملاحظة",n?.title||"","notes");loadInbox()}

/* ===== Modals ===== */
function modal(html){$("#modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${html}</div></div>`}
function closeModal(){$("#modalRoot").innerHTML="";if(PENDING){PENDING=false;setTimeout(rerender,0)}}
function projectModal(id,planName){
  if(!isAdmin())return;
  const p=id?DB.projects.find(x=>x.id===id):{client:"",plan:planName||"ORBIT",start:"",end:"",deadline:"",rating:0,status:"active",members:[],notes:""};
  const emps=DB.users.filter(u=>u.role!=="admin");
  modal(`<h3>${id?"تعديل المشروع":"مشروع جديد"}</h3><form id="pf" class="form">
   <div class="full"><label>اسم العميل / المشروع</label><input id="pc" value="${esc(p.client)}" required></div>
   <div class="full"><label>الباقة المعتمدة (من موقع Fast Techno)</label><select id="pp">${PLANS.items.map(x=>`<option value="${x.name}" ${x.name===p.plan?"selected":""}>${x.icon} ${x.name} — ${x.price}</option>`).join("")}</select></div>
   <div><label>تاريخ البدء <span class="lock">🔒 المسؤول فقط</span></label><input type="date" id="ps" value="${p.start}" required></div>
   <div><label>تاريخ الانتهاء <span class="lock">🔒 المسؤول فقط</span></label><input type="date" id="pe" value="${p.end}" required></div>
   <div><label>Deadline</label><input type="date" id="pd" value="${p.deadline}" required></div>
   <div><label>الحالة</label><select id="pst">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===p.status?"selected":""}>${v[0]}</option>`).join("")}</select></div>
   <div class="full"><label>التقييم</label><div id="prt" style="font-size:24px"></div></div>
   <div class="full"><label>الموظفون المسؤولون عن المشروع</label><div class="chips" id="pm">${emps.length?emps.map(u=>`<span class="chip ${p.members.includes(u.id)?"on":""}" data-id="${u.id}" onclick="this.classList.toggle('on')">${esc(u.name)}</span>`).join(""):`<span style="color:var(--muted);font-size:13px">لا يوجد موظفون — أضفهم من صفحة الموظفين</span>`}</div></div>
   <div class="full"><label>ملاحظات</label><textarea id="pn" rows="3">${esc(p.notes)}</textarea></div>
   <div class="full err" id="perr"></div>
  </form><div class="actions"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveProject('${id||""}')">حفظ</button></div>`);
  let rv=p.rating;const rr=()=>{$("#prt").innerHTML=[1,2,3,4,5].map(i=>`<span style="cursor:pointer;color:${i<=rv?"#ffc94a":"var(--star-off)"}" data-v="${i}">★</span>`).join("");$("#prt").querySelectorAll("span").forEach(s=>s.onclick=()=>{rv=+s.dataset.v===rv?0:+s.dataset.v;rr()})};rr();
  window._rv=()=>rv;
}
function saveProject(id){
  const v={client:$("#pc").value.trim(),plan:$("#pp").value,start:$("#ps").value,end:$("#pe").value,deadline:$("#pd").value,status:$("#pst").value,rating:window._rv(),members:[...document.querySelectorAll("#pm .chip.on")].map(c=>c.dataset.id),notes:$("#pn").value.trim()};
  if(!v.client||!v.start||!v.end||!v.deadline)return $("#perr").textContent="يرجى تعبئة اسم العميل والتواريخ";
  if(v.end<v.start)return $("#perr").textContent="تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء";
  const oldM=id?(DB.projects.find(x=>x.id===id).members||[]):[],newM=v.members.filter(m=>!oldM.includes(m));if(newM.length)notify(newM,"task","📌 تم إسنادك لمشروع جديد: "+v.client,"الباقة "+v.plan+" — Deadline: "+v.deadline,"projects");else if(id&&oldM.length)notify(v.members,"task","🔄 تم تحديث مشروع "+v.client,"Deadline: "+v.deadline,"projects");
  if(id){const p=DB.projects.find(x=>x.id===id);if(p.plan!==v.plan)p.targets={...PLAN_TARGETS[v.plan]};Object.assign(p,v)}else DB.projects.push({id:uid(),...v,targets:{...PLAN_TARGETS[v.plan]},created:Date.now()});
  save();closeModal();toast("تم حفظ المشروع ✓");go(location.hash.slice(1));
}
function delProject(id){if(!confirm("حذف هذا المشروع وكل بيانات المتابعة الخاصة به؟"))return;DB.projects=DB.projects.filter(p=>p.id!==id);delete DB.tracker[id];save();go("projects")}
function userModal(id){
  const u=id?DB.users.find(x=>x.id===id):{id:"",name:"",username:"",title:"",role:"employee",department:ME.role==="it_lead"?"it":ME.role==="photography_lead"?"photography":"marketing",manager_id:ME.role.endsWith("_lead")?ME.id:""};
  if(!u||!FTHierarchy.canManageTeam(ME)||id&&!FTHierarchy.canManage(ME,u))return toast("غير مسموح");
  modal(`<h3>${id?"تعديل حساب":"موظف جديد"}</h3><form class="form" onsubmit="return false">
  <div><label for="un">الاسم الكامل</label><input id="un" maxlength="100" value="${esc(u.name)}"></div>
  <div><label for="ut">المسمى الوظيفي</label><input id="ut" maxlength="100" value="${esc(u.title)}"></div>
  <div><label for="uu">Username</label><input id="uu" maxlength="50" value="${esc(u.username)}" dir="ltr"></div>
  <div><label for="upw">Password ${id?"(اتركه فارغاً لعدم التغيير)":""}</label><input id="upw" type="password" maxlength="200" autocomplete="new-password" dir="ltr"></div>
  <div><label for="ur">الصلاحية</label><select id="ur" onchange="syncUserForm()">${Object.entries(FTHierarchy.roles).filter(([r])=>isAdmin()||ME.role==="supervisor"&&["employee","marketing_lead","photography_lead"].includes(r)||ME.role.endsWith("_lead")&&r==="employee").map(([r,label])=>`<option value="${r}" ${r===u.role?"selected":""}>${label}</option>`).join("")}</select></div>
  <div><label for="ud">القسم</label><select id="ud" onchange="syncUserForm()">${Object.entries(FTHierarchy.departments).filter(([d])=>isAdmin()||ME.role==="supervisor"&&["marketing","design","photography"].includes(d)||ME.role==="it_lead"&&d==="it"||ME.role==="marketing_lead"&&["marketing","design"].includes(d)||ME.role==="photography_lead"&&d==="photography").map(([d,label])=>`<option value="${d}" ${d===u.department?"selected":""}>${label}</option>`).join("")}</select></div>
  <div class="full"><label for="um">المسؤول المباشر</label><select id="um" data-current="${esc(u.manager_id||"")}"></select></div>
  <div class="full err" id="uerr"></div></form><div class="actions"><button class="btn" onclick="closeModal()">إلغاء</button><button id="userSave" class="btn primary" onclick="saveUser('${id||""}')">حفظ</button></div>`);syncUserForm();
}
function syncUserForm(){
 const r=$("#ur").value,d=$("#ud"),m=$("#um");const fixed={admin:"management",supervisor:"management",it_lead:"it",marketing_lead:"marketing",photography_lead:"photography"};
 d.disabled=r!=="employee";if(fixed[r])d.value=fixed[r];else if(d.value==="management")d.value="marketing";
 const current=m.value||m.dataset.current||"";m.dataset.current="";
 const expected=d.value==="it"?"it_lead":d.value==="photography"?"photography_lead":"marketing_lead";
 m.disabled=r!=="employee"||d.value==="legal";
 const leads=m.disabled?[]:DB.users.filter(x=>x.role===expected&&(!ME.role.endsWith("_lead")||x.id===ME.id));
 m.innerHTML='<option value="">—</option>'+leads.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");m.value=leads.some(x=>x.id===current)?current:leads.length===1?leads[0].id:"";
 if(d.value==="it"&&r==="employee")$("#ut").value="Developer";
}
const USER_ERRORS={forbidden:"غير مسموح لك بإدارة هذا الحساب",invalid_assignment:"اختر القسم والمسؤول المباشر الصحيحين",duplicate:"اسم المستخدم مستخدم مسبقاً",no_admin:"يجب أن يبقى مدير عام واحد على الأقل",has_reports:"انقل الموظفين التابعين أولاً قبل حذف مسؤولهم أو تغيير صلاحيته",use_employee_actions:"استخدم صفحة الموظفين لتغيير الحسابات",not_found:"الحساب غير موجود"};
async function saveUser(id){
 const pw=$("#upw").value;const u={id:id||uid(),name:$("#un").value.trim(),username:$("#uu").value.trim().toLowerCase(),title:$("#ut").value.trim(),role:$("#ur").value,department:$("#ud").value,manager_id:$("#um").disabled?null:$("#um").value||null};
 if(!u.name||u.name.length>100||u.title.length>100||!/^[a-z0-9._-]{3,50}$/.test(u.username))return $("#uerr").textContent="الاسم و Username مطلوبان (3–50 حرفاً إنجليزياً)";
 if((!id||pw)&&pw.length<6)return $("#uerr").textContent="كلمة المرور 6 أحرف على الأقل";
 if(!FTHierarchy.canManage(ME,u)||!FTHierarchy.validAssignment(u,DB.users))return $("#uerr").textContent="اختر القسم والمسؤول المباشر الصحيحين";
 if(u.department==="it"&&u.role==="employee")u.title="Developer";
 const btn=$("#userSave");btn.disabled=true;
 try{u.pass=pw?await sha(pw):"";const r=await rpc("ft_user_save",{p_token:TOK,p_user:u,p_new:!id});if(r.error){$("#uerr").textContent=USER_ERRORS[r.error]||"تعذّر الحفظ";return}if(!apply(r))return;closeModal();rerender();toast("تم حفظ الحساب ✓")}catch(e){if($("#uerr"))$("#uerr").textContent="تعذّر الحفظ؛ تأكد من تطبيق ملف تحديث الصلاحيات واتصال الإنترنت"}finally{btn.disabled=false}
}
async function delUser(id){
 const u=DB.users.find(x=>x.id===id);if(!u||!FTHierarchy.canManage(ME,u)||id===ME.id)return toast("غير مسموح");
 if(!confirm("حذف هذا الحساب؟"))return;
 try{const r=await rpc("ft_user_delete",{p_token:TOK,p_id:id});if(r.error)return toast(USER_ERRORS[r.error]||"تعذّر الحذف");if(apply(r)){rerender();toast("تم حذف الحساب")}}catch(e){toast("تعذّر الحذف؛ لم تتغير البيانات")}
}
function dl(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function exportData(){dl(`fasttechno-backup-${today()}.json`,JSON.stringify(DB,null,2),"application/json")}
function importData(inp){const f=inp.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!d.users||!d.projects)throw 0;if(!confirm("سيتم استبدال جميع البيانات الحالية. متابعة؟"))return;DB=d;save({meta:true,tracker:"all"}).then(()=>{toast("تم الاستيراد ✓");start()})}catch(e){toast("ملف غير صالح")}})}
function exportCSV(){const rows=[["Client","Plan","Price","Start","End","Deadline","Status","Rating","Progress %","Team"]];DB.projects.forEach(p=>rows.push([p.client,p.plan,planOf(p.plan)?.price,p.start,p.end,p.deadline,p.status,p.rating,progress(p),p.members.map(m=>DB.users.find(u=>u.id===m)?.name).join(" | ")]));dl(`fasttechno-projects-${today()}.csv`,"\ufeff"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}

if(TOK)refresh(true).then(()=>{if(TOK&&ME)start()});

<script>
/* Shared enhancement for initial and dynamically rendered password fields. */
(function () {
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3 3.7M6.3 6.3A20 20 0 0 0 2 12s3.5 7 10 7a13 13 0 0 0 5.7-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function update(input, button) {
    const shown = input.type === 'text';
    const english = document.documentElement.lang === 'en';
    const label = english ? (shown ? 'Hide password' : 'Show password') : (shown ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
    button.setAttribute('aria-pressed', String(shown));
    button.innerHTML = shown ? eyeOff : eye;
  }
  let counter = 0;
  function enhance() {
    document.querySelectorAll('input[type="password"]').forEach(input => {
      if (input.closest('.password-field')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'password-field';
      input.before(wrapper);
      wrapper.append(input);
      if (!input.id) input.id = 'password-field-' + (++counter);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn password-toggle';
      button.setAttribute('aria-controls', input.id);
      button.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        update(input, button);
      });
      wrapper.append(button);
      update(input, button);
    });
  }
  enhance();
  new MutationObserver(enhance).observe(document.body, { childList: true, subtree: true });
  new MutationObserver(() => {
    document.querySelectorAll('.password-field').forEach(wrapper => {
      const input = wrapper.querySelector('input');
      const button = wrapper.querySelector('.password-toggle');
      if (input && button) update(input, button);
    });
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
})();
</script>
