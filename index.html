<style>
:root,html[data-theme="dark"]{--input-bg:rgba(5,7,15,.6);--aside-bg:rgba(5,7,15,.75);--feat:var(--feat);--star-off:var(--star-off);--track:rgba(255,255,255,.06);--hover:rgba(255,255,255,.015);--pop-shadow:0 20px 60px rgba(0,0,0,.6);--bg:#05070F;--bg-2:#0B1120;--surface-1:rgba(14,20,36,.72);--surface-2:rgba(20,28,48,.85);--cyan:#3FD4FF;--blue:#3A7BFF;--violet:#6C7CFF;--white:#EEF3FB;--muted:#8A97AD;--glass:rgba(255,255,255,.035);--line:rgba(150,170,205,.12);--line-strong:rgba(150,170,205,.22);--grad:linear-gradient(120deg,#5FE0FF,#3A7BFF 60%,#6C7CFF);--ok:#2fd18b;--warn:#ffb547;--bad:#ff5d6c;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);background-image:radial-gradient(900px 500px at 85% -10%,rgba(58,123,255,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(63,212,255,.08),transparent 60%);background-attachment:fixed}
.en{font-family:'Space Grotesk','Cairo',sans-serif}
a{color:var(--cyan)}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--glass);color:var(--white);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px -8px rgba(58,123,255,.6)}
.btn.danger{border-color:rgba(255,93,108,.4);color:var(--bad)}
.btn.danger-solid{background:linear-gradient(135deg,#ff5d6c,#d62f45);border:0;color:#fff;box-shadow:0 10px 28px -10px rgba(255,93,108,.75)}
.btn.danger-solid:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.danger-card{border-color:rgba(255,93,108,.35)!important;background:linear-gradient(180deg,rgba(255,93,108,.07),transparent 70%),var(--bg-2)}
.danger-card h3{color:var(--bad)}
.danger-card .dz-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;padding:0;list-style:none}
.danger-card .dz-list li{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,93,108,.3);color:var(--muted)}
.wipe{width:100%}
.wipe-ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:28px;margin-bottom:14px;background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.4);color:var(--bad);animation:wipePulse 1.8s ease-in-out infinite}
@keyframes wipePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,108,.35)}50%{box-shadow:0 0 0 10px rgba(255,93,108,0)}}
.wipe-sub{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 16px}
.wipe-opts{display:grid;gap:8px;margin-bottom:14px}
.wipe-opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line-strong);border-radius:12px;cursor:pointer;margin:0;transition:border-color .2s,background .2s}
.wipe-opt:has(input:checked){border-color:rgba(255,93,108,.6);background:rgba(255,93,108,.07)}
.wipe-opt input{width:auto;margin-top:3px;accent-color:#ff5d6c}
.wipe-opt b{display:block;font-size:14px;margin-bottom:3px}
.wipe-opt small{color:var(--muted);font-size:12px;line-height:1.7}
.wipe-ack{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:12px 0 0;cursor:pointer}
.wipe-ack input{width:auto;accent-color:#ff5d6c}
.wipe-err{min-height:20px;color:var(--bad);font-size:13px;margin-top:10px}
.wipe-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.wipe-backup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-strong);margin-bottom:14px;font-size:12px;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,select,textarea{width:100%;background:var(--input-bg);border:1px solid var(--line-strong);color:var(--white);border-radius:11px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,212,255,.12)}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
.password-field{position:relative;width:100%}
.password-field input{padding-left:52px}
.password-field .password-toggle{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:40px;height:36px;padding:0;justify-content:center;border:0;background:transparent;color:var(--muted);border-radius:8px}
.password-field .password-toggle:hover{transform:translateY(-50%);color:var(--cyan);background:var(--glass)}
.password-toggle:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.password-toggle svg{width:20px;height:20px;pointer-events:none}
@media(max-width:480px){.modal .form .password-field input{padding-left:52px}}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{width:min(420px,100%);text-align:center}
.login-box img{height:74px;margin-bottom:10px;filter:drop-shadow(0 0 22px rgba(63,212,255,.35))}
.login-box h1{font-size:22px;margin:4px 0 2px}.sys-title{direction:ltr;unicode-bidi:isolate;font-family:'Space Grotesk','Cairo',sans-serif!important;font-size:clamp(22px,5vw,28px)!important;letter-spacing:.3px;font-weight:800}.sys-word{font-weight:600;opacity:.92}
.login-box form{text-align:start;display:grid;gap:14px;margin-top:22px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.8}
/* layout */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-inline-end:1px solid var(--line);background:var(--aside-bg);backdrop-filter:blur(14px);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
aside .brand img{height:38px}
aside .brand b{font-size:15px;display:block}
aside .brand small{color:var(--muted);font-size:11px}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:4px;cursor:pointer}
nav a:hover{background:var(--glass);color:var(--white)}
nav a.active{background:linear-gradient(120deg,rgba(95,224,255,.14),rgba(58,123,255,.18));color:var(--white);border:1px solid var(--line-strong)}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
main{padding:26px clamp(16px,3vw,36px);overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}

.bar{height:7px;border-radius:9px;background:var(--track);overflow:hidden;min-width:80px}

/* plans */
.plans{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.plan.featured{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 20px 50px -20px rgba(58,123,255,.5)}

.modal{position:fixed;inset:0;background:rgba(2,4,10,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}

.lock{font-size:11px;color:var(--warn)}

.trk td.d{text-align:start;white-space:nowrap;font-family:'Space Grotesk'}

 .modal{padding:10px;align-items:end}
 .modal .card{max-height:calc(100dvh - 20px);border-radius:18px}
 .toast{left:12px!important;right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
 input,select,textarea{font-size:16px!important}
}
@media (max-width:360px){.hub-row{grid-template-columns:1fr}.btn{padding:8px 12px}}
@media (max-height:520px) and (orientation:landscape){aside{padding-top:10px}aside .brand{padding-bottom:10px;margin-bottom:6px}#nav a{padding:8px 12px;min-height:36px}}
@media (hover:none){.btn:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
<style id="ft-mobile-pro">
/* ===== Mobile Pro layer ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%}
input,select,textarea,button{max-width:100%;font-family:inherit}
.card{min-width:0;overflow-wrap:anywhere}
.btn{min-height:40px;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:34px}
@media (max-width:900px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat .n{font-size:24px}
 .card{padding:16px}
 .modal .card{width:100%}
 .toolbar input,.toolbar select{min-width:0}
}
@media (max-width:640px){
 body{font-size:14px}
 .card{padding:14px;border-radius:14px}
 .grid{gap:12px}
 .stats{gap:10px}
 .stat .n{font-size:22px}.stat .l{font-size:12px}
 .top{gap:8px}
 .top>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
 .top>div:last-child .btn{flex:1 1 auto}
 .btn{min-height:44px;padding:10px 14px;border-radius:12px;font-size:14px}
 .btn.sm{min-height:38px;padding:7px 12px;font-size:13px}
 .toolbar{gap:8px}
 .toolbar>*{flex:1 1 100%!important;width:100%}
 input,select,textarea{min-height:44px}
 input[type=checkbox],input[type=radio]{min-height:auto}
 .form{grid-template-columns:1fr!important}
 .modal{padding:0;align-items:end}
 .modal .card{max-height:92dvh;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:ftSheet .3s cubic-bezier(.22,1,.36,1)}
 .modal .actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg-2);padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-bottom:0;z-index:2}
 /* tables -> cards */
 .tbl.ft-cards{overflow:visible}
 table.ft-cards thead{display:none}
 table.ft-cards,table.ft-cards tbody{display:block;width:100%}
 table.ft-cards tr{display:block;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-1)}
 table.ft-cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:end;border:0;padding:7px 0;white-space:normal;overflow-wrap:anywhere;font-size:13.5px}
 table.ft-cards td+td{border-top:1px dashed var(--line)}
 table.ft-cards td[data-label]:not([data-label=""])::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:start;flex:none;max-width:45%}
 table.ft-cards td>*:only-child{margin-inline-start:auto}
 table.ft-cards td:has(.btn){flex-wrap:wrap;justify-content:flex-end}
 table.ft-cards td[colspan]{justify-content:center;text-align:center}
 table.ft-cards td[colspan]::before{display:none}
 /* wide tables that stay scrollable */
 .tbl:not(.ft-cards){margin-inline:-14px;padding-inline:14px;scroll-snap-type:x proximity}
 .tbl:not(.ft-cards) th,.tbl:not(.ft-cards) td{padding:9px 8px;font-size:12.5px;white-space:nowrap}
 .tbl:not(.ft-cards) th:first-child,.tbl:not(.ft-cards) td:first-child{position:sticky;inset-inline-start:0;background:var(--bg-2);z-index:1}
 .cal-day.btn{min-height:0}
 #npanel{max-height:85dvh}
}
@media (max-width:380px){
 .stats{grid-template-columns:1fr 1fr}
 .stat .n{font-size:19px}
 main{padding-inline:10px}
 .top{margin-inline:-10px;padding-inline:10px}
 .top h2{font-size:16px}
}
@keyframes ftSheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
<style id="ft-mobile-root-fix">
/* Root fix: on phones/tablets the sidebar is an off-canvas drawer, so the page must use the full width */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
img,video,canvas,svg,iframe{max-width:100%}
@media (max-width:900px){
 #app{display:block!important;grid-template-columns:none!important;width:100%!important;max-width:100vw}
 #app>main,#main{display:block;width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;grid-column:auto!important}
 #main>*:not(.top){max-width:100%;min-width:0}
 .top{max-width:none!important;width:auto!important}
 .card,.grid,.toolbar,.form,.hub-m,.calendar-layout{min-width:0;max-width:100%}
 .table-wrap,.tbl,[class*="table"]{max-width:100%}
 table{max-width:100%}
}
@media (max-width:600px){
 main,#main{padding-inline:12px!important}
 .top{margin:-18px -12px 16px!important;padding-inline:12px!important}
}
@media (max-width:380px){
 main,#main{padding-inline:10px!important}
 .top{margin-inline:-10px!important;padding-inline:10px!important}
}
@media (min-width:641px){
 .tbl th{white-space:nowrap}
 .tbl td{overflow-wrap:normal;word-break:normal}
 .tbl td .badge,.tbl td .pill,.tbl td b{white-space:nowrap}
}
@media (min-width:641px) and (max-width:1200px){
 .grid:has(.tbl){grid-template-columns:minmax(0,1fr)!important}
}
</style>
<style id="ft-mobile-ux">
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#ft-tabbar{display:none}
@media (max-width:900px){
 input,select,textarea{font-size:16px!important}
 html{scroll-behavior:smooth}
 main,#main{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
 .top{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
 .top h2{font-size:18px;line-height:1.3}
 .top p{font-size:12px;opacity:.8;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
 .card{border-radius:16px;transition:transform .15s}
 .card h3{font-size:16px}
 .stat{border-radius:14px}
 #nav a{min-height:48px;font-size:15px;border-radius:12px}
 aside{width:min(84vw,300px)!important;box-shadow:0 0 40px rgba(0,0,0,.5);overflow-y:auto;-webkit-overflow-scrolling:touch}
 #ft-tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:35;height:62px;padding:6px;gap:4px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line-strong);box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
 #ft-tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:14px;background:transparent;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .15s;touch-action:manipulation}
 #ft-tabbar button .i{font-size:19px;line-height:1}
 #ft-tabbar button span.t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
 #ft-tabbar button.on{color:var(--white);background:linear-gradient(120deg,rgba(95,224,255,.16),rgba(58,123,255,.22))}
 #ft-tabbar button:active{transform:scale(.92)}
 body.ft-lock #ft-tabbar,body:has(.modal.show) #ft-tabbar,body:has(.modal[style*="flex"]) #ft-tabbar{opacity:0;pointer-events:none}
 #live{bottom:calc(82px + env(safe-area-inset-bottom))!important;left:12px!important;font-size:11px!important;padding:4px 10px!important;opacity:.85}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
@media print{#ft-tabbar{display:none!important}}
</style>
</head>

const TNAME=k=>(TASKS.find(t=>t[0]===k)||[])[1]||k;
function doneTasks(uid){const out=[];visibleProjects().forEach(p=>{const t=DB.tracker[p.id]||{};Object.entries(t).forEach(([d,r])=>{if(!r)return;TASKS.forEach(([k])=>{if(r[k]&&r.by?.[k]&&(!uid||r.by[k]===uid)){const rt=(p.taskRatings||{})[d+"|"+k]||{};out.push({p,d,k,by:r.by[k],at:r.at?.[k],s:rt.s||0,c:rt.c||"",note:r.note||""})}})})});return out.sort((a,b)=>(b.d+(b.at||"")).localeCompare(a.d+(a.at||"")))}

function rateTask(pid,d,k,v){if(!isAdmin())return;const p=DB.projects.find(x=>x.id===pid);p.taskRatings=p.taskRatings||{};const key=d+"|"+k,o=p.taskRatings[key]||{};if(o.s===v)delete o.s;else{o.s=v;o.by=ME.id;o.at=new Date().toISOString()}if(!o.s&&!o.c)delete p.taskRatings[key];else p.taskRatings[key]=o;save();toast("تم حفظ التقييم ✓");const who=DB.tracker[pid]?.[d]?.by?.[k];if(who&&o.s){const tn=TASKS.find(x=>x[0]===k);notify([who],"rate","⭐ تم تقييم مهمتك "+o.s+"/5","مهمة "+tn[2]+" في مشروع "+p.client+" — يوم "+d,"ratings")}}
function commentTask(pid,d,k){if(!isAdmin())return;const p=DB.projects.find(x=>x.id===pid);p.taskRatings=p.taskRatings||{};const key=d+"|"+k,o=p.taskRatings[key]||{};const c=prompt("ملاحظة المدير على هذه المهمة:",o.c||"");if(c===null)return;o.c=c.trim();if(!o.s&&!o.c)delete p.taskRatings[key];else p.taskRatings[key]=o;save();toast("تم حفظ الملاحظة ✓");const who=DB.tracker[pid]?.[d]?.by?.[k];if(who&&o.c){const tn=TASKS.find(x=>x[0]===k);notify([who],"rate","💬 ملاحظة المدير على مهمتك",tn[2]+" — "+p.client+": "+o.c,"ratings")}}

function taskTable(l,showEmp){if(!l.length)return `<div class="empty">لا توجد مهام منجزة بعد</div>`;const ed=isAdmin();return `<table><thead><tr><th>التاريخ</th><th>المشروع</th><th>المهمة</th>${showEmp?"<th>الموظف</th>":""}<th>الحالة</th><th>وقت الإنجاز</th><th>التقييم</th><th>ملاحظة المدير</th></tr></thead><tbody>${l.map(x=>`<tr><td class="en">${fmt(x.d)}</td><td><a style="color:var(--white);font-weight:700;cursor:pointer" onclick="go('projects/${x.p.id}')">${esc(x.p.client)}</a></td><td><span class="badge b-plan en">${TNAME(x.k)}</span></td>${showEmp?`<td>${ed?`<a style="cursor:pointer;color:var(--white)" onclick="go('team/${x.by}')">${esc(uName(x.by))}</a>`:esc(uName(x.by))}</td>`:""}<td><span class="badge b-ok">✓ مكتملة</span></td><td class="en" style="font-size:12px">${fmtAt(x.at)}</td><td style="white-space:nowrap">${tStars(x,ed)} ${x.s?"":`<small style="color:var(--warn)">${ed?"بانتظار تقييمك":"لم تُقيَّم بعد"}</small>`}</td><td style="font-size:12px;max-width:220px">${esc(x.c)||"—"} ${ed?`<button class="btn sm" onclick="commentTask('${x.p.id}','${x.d}','${x.k}')">✎</button>`:""}</td></tr>`).join("")}</tbody></table>`}

let CALDAY=today(),CALMONTH=CALDAY.slice(0,7),CALPROJECT='',CALBUSY=false;
function calendarRows(d){return FTDaily.entries(visibleProjects().filter(p=>!CALPROJECT||p.id===CALPROJECT),DB.tracker||{},d,TASKS.map(t=>t[0]))}
function calendarMove(n){const d=new Date(CALMONTH+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);CALMONTH=d.toISOString().slice(0,7);VIEWS.calendar()}

VIEWS.calendar=function(){
 const first=new Date(CALMONTH+'-01T12:00:00Z'),count=new Date(first.getUTCFullYear(),first.getUTCMonth()+1,0).getDate(),offset=first.getUTCDay(),locale=LANG==='en'?'en-GB':'ar-JO',rows=calendarRows(CALDAY),done=rows.filter(r=>r.done).length;
 const weekdays=LANG==='en'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat']:['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
 const cells=Array.from({length:offset},()=>'<div class="cal-blank"></div>').join('')+Array.from({length:count},(_,i)=>{const d=CALMONTH+'-'+String(i+1).padStart(2,'0'),r=calendarRows(d),c=r.filter(x=>x.done).length;return `<button class="btn cal-day ${d===CALDAY?'selected':''} ${d===today()?'is-today':''}" onclick="calendarSelect('${d}')" aria-label="${d}" aria-pressed="${d===CALDAY}"><b class="en">${i+1}</b>${d===today()?'<small>اليوم</small>':''}<span class="cal-count">${r.length?c+'/'+r.length:'—'}</span>${r.length?`<div class="bar"><i style="width:${c/r.length*100}%"></i></div>`:''}</button>`}).join('');
 $('#main').innerHTML=header('تقويم المهام',new Date(CALDAY+'T12:00:00').toLocaleDateString(locale,{weekday:'long',day:'numeric',month:'long',year:'numeric'}),`<button class="btn" onclick="CALDAY=today();CALMONTH=CALDAY.slice(0,7);VIEWS.calendar()">اليوم</button>`)+
 `<div class="toolbar"><select id="calProject" aria-label="المشروع"><option value="">كل المشاريع</option>${visibleProjects().map(p=>`<option value="${esc(p.id)}" ${CALPROJECT===p.id?'selected':''}>${esc(p.client)}</option>`).join('')}</select><input type="date" aria-label="التاريخ" value="${CALDAY}" onchange="if(this.value){CALDAY=this.value;CALMONTH=CALDAY.slice(0,7);VIEWS.calendar()}"></div><div class="calendar-layout"><section class="calendar-month"><div class="cal-heading"><button class="btn sm" title="الشهر السابق" aria-label="الشهر السابق" onclick="calendarMove(-1)">‹</button><h3>${first.toLocaleDateString(locale,{month:'long',year:'numeric'})}</h3><button class="btn sm" title="الشهر التالي" aria-label="الشهر التالي" onclick="calendarMove(1)">›</button></div><div class="cal-grid">${weekdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}${cells}</div></section><section class="calendar-agenda"><div class="cal-heading"><h3>مهام اليوم</h3><span class="badge ${done===rows.length&&rows.length?'b-ok':'b-plan'}">${done} / ${rows.length}</span></div><div class="bar cal-progress"><i style="width:${rows.length?done/rows.length*100:0}%"></i></div>${rows.length?rows.map(r=>{const record=DB.tracker[r.project.id]?.[CALDAY]||{},locked=CALDAY>today()||CALBUSY;return `<div class="daily-task ${r.done?'completed':''}"><input type="checkbox" aria-label="${esc(r.project.client+' — '+TNAME(r.key))}" ${r.done?'checked':''} ${locked?'disabled':''} onchange="calendarTick('${esc(r.project.id)}','${CALDAY}','${r.key}')"><div><b>${esc(TNAME(r.key))}</b><a onclick="go('projects/${esc(r.project.id)}')">${esc(r.project.client)}</a><small>${r.done?'✓ '+esc(uName(r.by))+' · '+fmtAt(r.at):CALDAY>today()?'قادم':CALDAY<today()?'بانتظار الإنجاز':'لم تُنجز بعد'}</small>${record.note?`<small>${esc(record.note)}</small>`:''}</div></div>`}).join(''):'<div class="empty">لا توجد مهام لهذا اليوم</div>'}<div id="calSave" role="status" aria-live="polite"></div></section></div>`;

async function calendarTick(pid,d,k){
 if(CALBUSY||d>today()||!TOK)return;
 CALBUSY=true;VIEWS.calendar();$('#calSave').textContent='جارٍ الحفظ…';
 try{
  const latest=await rpc('ft_get',{p_token:TOK});if(!apply(latest))throw new Error('session');

  const t=DB.tracker[pid]||(DB.tracker[pid]={}),r=t[d]||(t[d]={}),complete=!r[k];r[k]=complete;r.by=r.by||{};r.at=r.at||{};

const FTChime=(()=>{
  let ctx=null,last=-Infinity;
  function unlock(){
    try{
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx)return;
      if(!ctx||ctx.state==='closed')ctx=new AudioCtx();
      if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    }catch(e){}
  }
  function play(){
    if(!ctx||ctx.state!=='running'||performance.now()-last<1500)return;
    last=performance.now();
    try{
      const start=ctx.currentTime;
      [[659.25,0],[880,0.16]].forEach(([frequency,offset])=>{
        const oscillator=ctx.createOscillator(),gain=ctx.createGain();
        oscillator.type='sine';oscillator.frequency.value=frequency;
        gain.gain.setValueAtTime(0,start+offset);
        gain.gain.linearRampToValueAtTime(0.12,start+offset+0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001,start+offset+0.65);
        oscillator.connect(gain);gain.connect(ctx.destination);
        oscillator.start(start+offset);oscillator.stop(start+offset+0.7);
        oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
      });
    }catch(e){}
  }
  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('keydown',unlock);
  return {play};
})();

let WIPE_FAILS=0,WIPE_LOCK=0;
function wipeModal(){
 if(!isAdmin())return toast("غير مسموح");
 modal(`<div class="wipe"><div class="wipe-ic">⚠</div><h3 style="margin:0 0 6px">حذف جميع البيانات نهائياً</h3>
 <p class="wipe-sub">سيتم حذف البيانات فوراً لدى جميع المستخدمين، ولا يمكن التراجع عن هذا الإجراء بعد التنفيذ.</p>
 <div class="wipe-opts">
  <label class="wipe-opt"><input type="radio" name="wscope" value="keep" checked><div><b>الإبقاء على حسابات الموظفين (موصى به)</b><small>تُحذف بيانات العمل فقط وتبقى جميع الحسابات وصلاحياتها كما هي</small></div></label>
  <label class="wipe-opt"><input type="radio" name="wscope" value="all"><div><b>حذف كل شيء بما فيه حسابات الموظفين</b><small>يبقى حسابك فقط: الموظفون، المشاريع، المتابعة اليومية، التقييمات، الملاحظات، الإشعارات، مهام IT، المهام الإضافية، سجلات العمل والمرفقات</small></div></label>
 </div>
 <div class="wipe-backup"><span>ننصح بتصدير نسخة احتياطية قبل الحذف</span><button type="button" class="btn sm" onclick="exportData()">⬇ تصدير نسخة احتياطية</button></div>
 <form id="wipef" autocomplete="off">
  <label>كلمة مرور حسابك للتأكيد</label><input type="password" id="wpw" autocomplete="current-password" required>
  <label class="wipe-ack"><input type="checkbox" id="wack"> أفهم أن جميع البيانات ستُحذف نهائياً</label>
  <div class="wipe-err" id="werr"></div>
  <div class="wipe-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn danger-solid" id="wgo" disabled>🗑 حذف جميع البيانات</button></div>
 </form></div>`);
 const f=$("#wipef"),pw=$("#wpw"),ack=$("#wack"),go_=$("#wgo"),err=$("#werr");
 const sync=()=>{go_.disabled=!(pw.value&&ack.checked)||Date.now()<WIPE_LOCK};
 pw.oninput=()=>{err.textContent="";sync()};ack.onchange=sync;setTimeout(()=>pw.focus(),50);
 f.onsubmit=async e=>{
  e.preventDefault();if(!isAdmin())return toast("غير مسموح");
  if(Date.now()<WIPE_LOCK){err.textContent=`محاولات كثيرة، حاول بعد ${Math.ceil((WIPE_LOCK-Date.now())/1000)} ثانية`;return}
  if(!pw.value||!ack.checked)return;
  const h=await sha(pw.value);
  if(h!==ME.pass){WIPE_FAILS++;pw.value="";sync();
   if(WIPE_FAILS>=5){WIPE_FAILS=0;WIPE_LOCK=Date.now()+60000;err.textContent="محاولات كثيرة، تم إيقاف المحاولة لمدة 60 ثانية";setTimeout(sync,60100)}
   else err.textContent=`كلمة المرور غير صحيحة (${5-WIPE_FAILS} محاولات متبقية)`;
   return}
  const keep=(document.querySelector('input[name="wscope"]:checked')||{}).value==="keep";
  go_.disabled=true;go_.textContent="جارٍ حذف البيانات…";pw.disabled=true;
  let r;
  try{r=await rpc("ft_wipe_all",{p_token:TOK,p_hash:h,p_keep_users:keep})}
  catch(x){go_.textContent="🗑 حذف جميع البيانات";pw.disabled=false;sync();
   err.textContent=(x&&(x.code==="PGRST202"||/ft_wipe_all/.test(x.message||"")))?"ميزة الحذف غير مفعّلة على الخادم بعد":"تعذّر الاتصال بالخادم، لم يتم حذف أي بيانات";return}
  if(r&&r.error){go_.textContent="🗑 حذف جميع البيانات";pw.disabled=false;pw.value="";sync();
   err.textContent=r.error==="bad_password"?"كلمة المرور غير صحيحة":r.error==="forbidden"?"هذا الإجراء متاح للمدير العام فقط":"تعذّر الحذف، لم تتغير البيانات";return}
  WIPE_FAILS=0;
  if(r&&Array.isArray(r.files)&&r.files.length){try{const st=SBH().storage.from("ft-proofs");for(let i=0;i<r.files.length;i+=100)await st.remove(r.files.slice(i,i+100))}catch(_){}}
  try{Object.keys(localStorage).filter(k=>k.startsWith("ft_sent_")).forEach(k=>localStorage.removeItem(k))}catch(_){}
  if(typeof SUBS!=="undefined")SUBS=[];
  closeModal();
  if(r&&apply(r)){location.hash="dashboard";start();try{loadInbox(true)}catch(_){}}else await refresh(true);
  toast("تم حذف جميع البيانات بنجاح ✓");
 };
}

<script>
/* Shared enhancement for initial and dynamically rendered password fields. */
(function () {
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3 3.7M6.3 6.3A20 20 0 0 0 2 12s3.5 7 10 7a13 13 0 0 0 5.7-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function update(input, button) {
    const shown = input.type === 'text';
    const english = document.documentElement.lang === 'en';
    const label = english ? (shown ? 'Hide password' : 'Show password') : (shown ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
    button.setAttribute('aria-pressed', String(shown));
    button.innerHTML = shown ? eyeOff : eye;
  }
  let counter = 0;
  function enhance() {
    document.querySelectorAll('input[type="password"]').forEach(input => {
      if (input.closest('.password-field')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'password-field';
      input.before(wrapper);
      wrapper.append(input);
      if (!input.id) input.id = 'password-field-' + (++counter);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn password-toggle';
      button.setAttribute('aria-controls', input.id);
      button.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        update(input, button);
      });
      wrapper.append(button);
      update(input, button);
    });
  }
  enhance();
  new MutationObserver(enhance).observe(document.body, { childList: true, subtree: true });
  new MutationObserver(() => {
    document.querySelectorAll('.password-field').forEach(wrapper => {
      const input = wrapper.querySelector('input');
      const button = wrapper.querySelector('.password-toggle');
      if (input && button) update(input, button);
    });
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
})();
</script>

/* ---------- Smart auto task distribution (by specialty + plan) ---------- */
const FTAUTO=(()=>{
 const SPEC={stories:["marketing"],posts:["marketing"],reels:["photography"],design:["design"],ads:["marketing"],content:["marketing","photography"]};
 const ADS_RX=/ads|ad |media|إعلان|اعلان|ميديا/i;
 const active=()=>DB.projects.filter(p=>p.status!=="completed");
 function load(uid,skip){let n=0;active().forEach(p=>{if(p.id===skip)return;TASKS.forEach(([k])=>{if(p.assign?.[k]===uid)n+=+(p.targets?.[k]||0)})});return n}
 function avg(uid){const a=[];DB.projects.forEach(p=>{const t=DB.tracker[p.id]||{};Object.entries(p.taskRatings||{}).forEach(([key,o])=>{const [d,k]=key.split("|");if(o.s&&t[d]?.by?.[k]===uid)a.push(o.s)})});return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
 function eligible(k){return DB.users.filter(u=>!u.disabled&&u.role!=="admin")}
 function pick(k,p,pool){let c=eligible(k);if(pool.length){const inPool=c.filter(u=>pool.includes(u.id));if(inPool.length)c=inPool}
  if(k==="ads"){const ad=c.filter(u=>ADS_RX.test(u.title||""));if(ad.length)c=ad}
  if(!c.length)return null;
  const prev=DB.projects.filter(x=>x.id!==p.id&&x.client===p.client).map(x=>x.assign?.[k]);
  c.sort((a,b)=>load(a.id,p.id)-load(b.id,p.id)||avg(b.id)-avg(a.id)||(prev.includes(b.id)?1:0)-(prev.includes(a.id)?1:0));
  return c[0].id}
 function distribute(p,pool){const out={};TASKS.forEach(([k])=>{if(!(+(p.targets?.[k]||0)))return;const id=pick(k,p,pool||[]);if(id)out[k]=id});return out}
 const owner=(pid,k)=>DB.projects.find(x=>x.id===pid)?.assign?.[k]||null;
 const canDo=(pid,k)=>{const o=owner(pid,k);return !o||o===ME.id||canEditCreds()};
 function notifyAssign(p,assign,old){const by={};Object.entries(assign).forEach(([k,u])=>{if(old?.[k]===u)return;(by[u]=by[u]||[]).push(TNAME(k)+" ("+(p.targets?.[k]||0)+")")});Object.entries(by).forEach(([u,l])=>notify([u],"task","🎯 مهام جديدة مسندة إليك: "+p.client,"الباقة "+p.plan+" — "+l.join("، "),"projects/"+p.id))}
 return {SPEC,distribute,owner,canDo,load,notifyAssign,eligible};
})();

  $("#mtSave").onclick=async()=>{
   /* FIX: read selections from the form first (never mutate the stale "p" captured when the modal opened) */

 /* FIX: robust save — fetch latest data, apply changes to the fresh project object, save, then verify on the server copy */
 let busySave=false;
 async function commit(pid,sel,qty){
  if(busySave)return{ok:false,msg:T("جارٍ حفظ عملية سابقة…","A previous save is in progress…")};
  if(!TOK)return{ok:false,msg:T("انتهت الجلسة، سجّل الدخول مجدداً","Session expired, sign in again")};
  busySave=true;
  try{
   const latest=await rpc("ft_get",{p_token:TOK});if(!apply(latest))throw new Error("read");
   const p=DB.projects.find(x=>x.id===pid);if(!p)throw new Error("gone");
   const keys=Object.keys(sel);
   if(keys.some(k=>!canEdit(p,k)))throw new Error("perm");
   const allowed=k=>new Set(pool(p,k).map(u=>u.id));
   if(keys.some(k=>{const a=allowed(k);return sel[k].some(id=>!a.has(id))}))throw new Error("perm");
   const old={},oldQty={};keys.forEach(k=>{old[k]=list(p,k);oldQty[k]=p.targets?.[k]??0});
   p.assign={...(p.assign||{})};p.assignX={...(p.assignX||{})};p.targets={...(p.targets||{})};p.members=[...(p.members||[])];
   Object.entries(qty||{}).forEach(([k,v])=>{p.targets[k]=v});
   keys.forEach(k=>{const ids=[...new Set(sel[k])];
    if(!ids.length){delete p.assign[k];delete p.assignX[k];return}
    const primary=ids.includes(p.assign[k])?p.assign[k]:ids[0];p.assign[k]=primary;
    const extra=ids.filter(x=>x!==primary);if(extra.length)p.assignX[k]=extra;else delete p.assignX[k];
    ids.forEach(id=>{if(!p.members.includes(id))p.members.push(id)})});
   const want={};keys.forEach(k=>want[k]=list(p,k).slice().sort().join(","));
   const changes={};keys.forEach(k=>{const changed=list(p,k).slice().sort().join(",")!==old[k].slice().sort().join(","),quantityChanged=Object.prototype.hasOwnProperty.call(qty||{},k)&&Number(qty[k])!==Number(oldQty[k]);if(!changed&&!quantityChanged)return;changes[k]={ids:list(p,k),expected:old[k]};if(quantityChanged){changes[k].quantity=qty[k];changes[k].expectedQuantity=oldQty[k]}});
   if(!Object.keys(changes).length)return{ok:true};
   const res=await rpc("ft_assign_save",{p_token:TOK,p_project:pid,p_changes:changes});
   if(!res||res.error||!apply(res))throw new Error(res?.error||"save");
   const saved=DB.projects.find(x=>x.id===pid);
   if(!saved||keys.some(k=>list(saved,k).slice().sort().join(",")!==want[k]||Object.prototype.hasOwnProperty.call(qty||{},k)&&Number(saved.targets?.[k])!==qty[k]))throw new Error("rejected");
   const by={};keys.forEach(k=>list(saved,k).filter(u=>!old[k].includes(u)&&u!==ME.id).forEach(u=>(by[u]=by[u]||[]).push(TNAME(k)+" ("+(saved.targets?.[k]||0)+")")));
   Object.entries(by).forEach(([u,l])=>notify([u],"task","🎯 مهام جديدة مسندة إليك: "+saved.client,"الباقة "+saved.plan+" — "+l.join("، "),"projects/"+saved.id));
   return{ok:true};
  }catch(e){

   const m=e&&e.message;
   return{ok:false,msg:m==="conflict"?T("تغيّر التوزيع أثناء الحفظ؛ أعد الاختيار والمحاولة","Assignments changed during saving; choose again and retry"):m==="forbidden_role"||m==="forbidden"?T("حسابك لا يملك صلاحية توزيع المهام","Your account cannot assign tasks"):m==="closed"?T("المشروع مكتمل؛ فقط المدير العام أو المسؤول يمكنه تعديل توزيعه","Project is completed; only the general manager or supervisor can change it"):m==="forbidden_add"?T("يمكنك الإسناد لنفسك أو لموظفي فريقك فقط","You can only assign yourself or your team"):m==="forbidden_remove"?T("لا يمكنك إزالة موظف من خارج فريقك من هذه المهمة","You can’t remove an employee outside your team"):m==="unknown_employee"?T("أحد الموظفين المختارين معطّل أو غير موجود","A selected employee is disabled or missing"):m==="perm"?T("لا تملك صلاحية إسناد هذه المهمة لهذا الموظف","You can't assign this task to this employee"):m==="gone"?T("المشروع لم يعد موجوداً","Project no longer exists"):m==="rejected"?T("رفض الخادم حفظ التوزيع؛ تحقق من صلاحياتك","The server rejected the assignment; check your permissions"):T("تعذّر الحفظ؛ تحقق من الاتصال وأعد المحاولة","Couldn't save; check the connection and retry")};
  }finally{busySave=false}
 }

(function(){

 const _tv=window.trackerView;window.trackerView=function(id){_tv.apply(this,arguments);const p=DB.projects.find(x=>x.id===id);if(!p||!FTHierarchy.canManageTeam(ME))return;

 function myItems(){const out=[];DB.projects.filter(p=>p.status!=="completed").forEach(p=>{const t=DB.tracker[p.id]||{};TASKS.forEach(([k,en,ar])=>{const g=+(p.targets?.[k]||0);if(!g||!owners(p,k).includes(ME.id))return;

 VIEWS.mytasks=function(){const it=myItems(),left=it.reduce((s,x)=>s+x.left,0),done=it.reduce((s,x)=>s+x.mine,0),open=it.filter(x=>x.left>0);

 const ICON={stories:"📱",posts:"🖼️",reels:"🎬",design:"🎨",ads:"📣",content:"✍️"};
 const GUIDE={
  stories:["ستوري واحدة تُنشر على حسابات العميل. بعد النشر ارفع لقطة شاشة أو ملف الستوري.","One story published on the client's accounts. After publishing, upload a screenshot or the story file."],
  posts:["بوست احترافي واحد حسب هوية العميل. بعد النشر ارفع التصميم النهائي أو لقطة المنشور.","One professional post in the client's brand style. After publishing, upload the final design or a screenshot."],
  reels:["ريلز واحد (تصوير/مونتاج). ارفع الفيديو النهائي أو لقطة بعد النشر.","One reel (shoot/edit). Upload the final video or a screenshot after publishing."],
  design:["تصميم واحد حسب طلب العميل وهويته. ارفع ملف التصميم النهائي.","One design following the client's brief and brand. Upload the final design file."],
  ads:["إعلان ممول أو متابعة حملة. ارفع لقطة من مدير الإعلانات توضّح الإعلان ونتائجه.","A paid ad or campaign follow-up. Upload a screenshot from Ads Manager showing the ad and results."],
  content:["مهمة صانع محتوى (تصوير/فكرة/نص). ارفع الملف أو المحتوى المنجز.","A content-creator task (shoot/idea/copy). Upload the finished file or content."]
 };
 const owners=(p,k)=>window.FTMT?FTMT.list(p,k):[p?.assign?.[k]].filter(Boolean);
 const mine=(p,k)=>!!ME&&owners(p,k).includes(ME.id);
 const isManager=()=>!!ME&&["admin","supervisor"].includes(ME.role);
 const isLead=()=>!!ME&&["it_lead","marketing_lead","photography_lead"].includes(ME.role);
 let CALMINE=true;
 const calMineOn=()=>!isManager()&&(!isLead()||CALMINE);
 const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
 const fmtDay=d=>new Date(d+"T12:00:00").toLocaleDateString(LANG==="en"?"en-GB":"ar-JO",{weekday:"long",day:"numeric",month:"long"});
 const myProjects=()=>visibleProjects().filter(p=>p.status!=="completed"&&KEYS.some(k=>mine(p,k)));

 function state(p,d,k){
  const s=window.FTWF&&FTWF.subOf?FTWF.subOf(p.id,d,k):null,tr=!!DB.tracker[p.id]?.[d]?.[k];
  if(s&&s.status==="approved")return{st:"done",s,label:T("معتمدة ✓","Approved ✓"),cls:"b-ok"};
  if(s&&s.status==="rej_emp")return{st:"rejected",s,label:T("مرفوضة — أعد الرفع","Rejected — re-upload"),cls:"b-bad"};
  if(s)return{st:"pending",s,label:STAGE(s.status),cls:"b-warn"};
  if(tr)return{st:"done",s:null,label:T("منجزة ✓","Done ✓"),cls:"b-ok"};
  return{st:"todo",s:null,label:T("مطلوب رفعها","To upload"),cls:"b-plan"};
 }
 function itemsFor(d){
  return FTDaily.entries(myProjects(),DB.tracker||{},d,KEYS).filter(r=>mine(r.project,r.key)).map(r=>({p:r.project,k:r.key,d,...state(r.project,d,r.key)}));
 }
 function taskStats(p,k){const g=+(p.targets?.[k]||0),done=Math.min(g,countDone(DB.tracker[p.id]||{},k));return{g,done,left:Math.max(0,g-done),pct:g?Math.round(done/g*100):0}}
 const STAGE=st=>({lead:T("بانتظار مسؤول الفريق","Awaiting team lead"),sup:T("بانتظار المسؤول","Awaiting supervisor"),admin:T("بانتظار المدير العام","Awaiting general manager"),ret_lead:T("قيد المراجعة لدى مسؤول الفريق","Under team-lead review"),ret_sup:T("قيد المراجعة لدى المسؤول","Under supervisor review")})[st]||T("بانتظار الموافقة","Awaiting approval");
 const doAttach=(pid,d,k)=>window.attachModal?window.attachModal(pid,d,k):FTWF.attach(pid,d,k);
 const ORDER={rejected:0,todo:1,pending:2,done:3};

 function card(x,showDay){
  const t=taskStats(x.p,x.k),daysLeft_=Math.max(0,Math.ceil((new Date(x.p.end+"T12:00:00Z")-new Date(today()+"T12:00:00Z"))/864e5)),team=owners(x.p,x.k).length;
  const rej=x.st==="rejected"?((x.s.history||[]).slice(-1)[0]?.note||""):"",dayNote=DB.tracker[x.p.id]?.[x.d]?.note||"";
  const cta={todo:T("ارفع المهمة ←","Upload task →"),rejected:T("أعد الرفع ←","Re-upload →"),pending:T("عرض الحالة","View status"),done:T("عرض","View")}[x.st];
  return `<div class="ftd-task st-${x.st}" role="button" tabindex="0" onclick="FTDASH.open('${esc(x.p.id)}','${x.d}','${x.k}')" onkeydown="if(event.key==='Enter')this.click()">
   <div class="ftd-ic">${ICON[x.k]||"•"}</div>
   <div class="ftd-body">
    <div class="ftd-top"><b>${esc(TNAME(x.k))}</b><span class="badge ${x.cls}">${esc(x.label)}</span>${showDay?`<span class="badge b-mut">${esc(fmtDay(x.d))}</span>`:""}</div>
    <div class="ftd-meta"><span>👤 ${esc(x.p.client)}</span><span class="badge b-plan">${esc(x.p.plan||"")}</span>${x.p.deadline?`<span>Deadline: ${deadlineBadge(x.p)}</span>`:""}${team>1?`<span>👥 ${T("مشتركة مع","Shared with")} ${team-1}</span>`:""}</div>
    <div class="ftd-req"><em>${T("المطلوب منك:","What you need to do:")}</em> ${esc(GUIDE[x.k]?.[LANG==="en"?1:0]||"")}</div>
    ${rej?`<div class="ftd-note bad">❌ ${T("سبب الرفض:","Rejection reason:")} ${esc(rej)}</div>`:""}
    ${dayNote?`<div class="ftd-note">📝 ${esc(dayNote)}</div>`:""}
    ${t.g?`<div class="ftd-prog"><span>${T("تقدّم المشروع","Project progress")}</span><div class="bar"><i style="width:${t.pct}%"></i></div><b class="en">${t.done}/${t.g}</b><span>· ${T("متبقٍ","left")} <b class="en">${t.left}</b> · ${T("ينتهي بعد","ends in")} <b class="en">${daysLeft_}</b> ${T("يوم","days")}</span></div>`:""}
   </div>
   <div class="ftd-cta">${cta}</div>
  </div>`;
 }

 function section(){
  const d=today(),items=itemsFor(d).sort((a,b)=>ORDER[a.st]-ORDER[b.st]);
  const done=items.filter(x=>x.st==="done").length,pend=items.filter(x=>x.st==="pending").length,left=items.filter(x=>x.st==="todo"||x.st==="rejected").length;
  const overdue=[];for(let i=1;i<=14;i++){const day=addDays(d,-i);itemsFor(day).forEach(x=>{if(x.st==="todo"||x.st==="rejected")overdue.push(x)})}
  const pct=items.length?Math.round(done/items.length*100):0;
  const month=[];myProjects().forEach(p=>KEYS.forEach(k=>{if(mine(p,k)){const t=taskStats(p,k);if(t.g)month.push({p,k,...t})}}));
  month.sort((a,b)=>b.left-a.left);
  const mg=month.reduce((s,x)=>s+x.g,0),md=month.reduce((s,x)=>s+x.done,0);
  const headTxt=!items.length?T("لا توجد مهام مطلوبة منك اليوم","Nothing is due from you today"):left?T(`لديك ${left} من ${items.length} مهام بانتظار الرفع اليوم`,`You have ${left} of ${items.length} tasks to upload today`):pend?T("رفعت كل مهامك، بعضها بانتظار الموافقة","All uploaded — some are awaiting approval"):T("أحسنت! أنجزت كل مهام اليوم 🎉","Great job! All of today's tasks are done 🎉");
  return `<section class="card ftd" id="ftdToday">
   <div class="ftd-head"><div><h3>🎯 ${T("مهامي اليوم","My tasks today")}</h3><p>${esc(fmtDay(d))} · ${headTxt}</p><p>${T("انقر على أي مهمة لرفع إثبات الإنجاز في مكانها المخصص.","Click any task to upload its proof in the right place.")}</p></div>
    <div class="ftd-ring" style="--p:${pct}" title="${done}/${items.length}"><div><b class="en">${pct}%</b><small class="en">${done}/${items.length}</small></div></div></div>
   <div class="ftd-kpis">
    <div class="ftd-kpi ok"><b class="en">${done}</b><span>${T("مكتملة اليوم","Done today")}</span></div>
    <div class="ftd-kpi warn"><b class="en">${pend}</b><span>${T("بانتظار الموافقة","Awaiting approval")}</span></div>
    <div class="ftd-kpi"><b class="en">${left}</b><span>${T("متبقية اليوم","Left today")}</span></div>
    <div class="ftd-kpi bad"><b class="en">${overdue.length}</b><span>${T("متأخرة (آخر 14 يوم)","Overdue (14 days)")}</span></div>
   </div>
   <div class="ftd-list">${items.length?items.map(x=>card(x,false)).join(""):`<div class="ftd-empty"><b>☕</b>${T("لا توجد مهام مجدولة لك اليوم. تابع مهامك القادمة من تقويم المهام.","No tasks scheduled for you today. Check upcoming tasks in the calendar.")}</div>`}</div>
   ${overdue.length?`<details class="ftd-details" ${left?"":"open"}><summary class="ftd-sec">⏰ ${T("مهام فائتة لم تُرفع بعد","Missed tasks not uploaded yet")} <span class="badge b-bad en">${overdue.length}</span> <small>${T("(انقر للعرض)","(click to show)")}</small></summary><div class="ftd-list">${overdue.slice(0,20).map(x=>card(x,true)).join("")}</div></details>`:""}
   ${month.length?`<div class="ftd-sec">📊 ${T("تقدّمي في المشاريع","My progress across projects")} <small class="en">${md}/${mg} · ${T("متبقٍ","left")} ${Math.max(0,mg-md)}</small></div>
    <div>${month.slice(0,8).map(x=>`<div class="ftd-mrow"><div><b>${ICON[x.k]||""} ${esc(TNAME(x.k))}</b><br><small>${esc(x.p.client)}</small></div><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${x.pct}%"></i></div><small class="en">${x.pct}%</small></div><div style="text-align:end"><b class="en">${x.done}/${x.g}</b><br><small>${x.left?T("متبقٍ ","Left ")+x.left:T("مكتمل ✓","Complete ✓")}</small></div></div>`).join("")}</div>
    <div class="ftd-foot"><button class="btn sm" onclick="go('mytasks')">${T("كل مهامي ←","All my tasks →")}</button> <button class="btn sm" onclick="go('calendar')" style="margin-inline-start:8px">${T("تقويم مهامي","My calendar")}</button></div>`:""}
  </section>`;
 }

 const _dash=VIEWS.dashboard;
 VIEWS.dashboard=function(){_dash.apply(this,arguments);if(!ME||isManager())return;
  const top=document.querySelector("#main .top");if(top)top.insertAdjacentHTML("afterend",section());};

 /* Calendar: only the employee's own tasks */
 const _rows=window.calendarRows;
 window.calendarRows=calendarRows=function(d){const r=_rows(d);return calMineOn()?r.filter(x=>mine(x.project,x.key)):r};
 const _cal=VIEWS.calendar;
 VIEWS.calendar=function(){_cal.apply(this,arguments);if(!ME||isManager())return;
  const on=calMineOn(),sel=$("#calProject");
  if(sel&&on)[...sel.options].forEach(o=>{if(o.value&&!myProjects().some(p=>p.id===o.value))o.remove()});
  const tb=document.querySelector("#main .toolbar");
  if(tb)tb.insertAdjacentHTML("afterend",`<div class="ftd-mine-note">${isLead()?`<span class="ftd-seg"><button class="${on?"on":""}" onclick="FTDASH.calMine(true)">${T("مهامي فقط","Only mine")}</button><button class="${on?"":"on"}" onclick="FTDASH.calMine(false)">${T("مهام الفريق","Team tasks")}</button></span>`:""}<span>${on?T("🔒 يظهر هنا فقط المهام المسندة إليك. انقر على المهمة لرفع إثبات الإنجاز.","🔒 Only tasks assigned to you are shown. Click a task to upload its proof."):T("تعرض كل مهام المشاريع التي تتابعها.","Showing all tasks of projects you follow.")}</span></div>`);
  if(CALDAY<=today())document.querySelectorAll(".daily-task").forEach(el=>{const cb=el.querySelector("input[type=checkbox]");const m=(cb?.getAttribute("onchange")||"").match(/'([^']+)','([^']+)','([^']+)'/);if(!m)return;const p=DB.projects.find(x=>x.id===m[1]);if(!p||!mine(p,m[3]))return;const st=state(p,m[2],m[3]).st;
   if(st==="todo"||st==="rejected")el.insertAdjacentHTML("beforeend",`<button class="btn sm primary ftd-up" onclick="event.stopPropagation();FTDASH.attach('${esc(m[1])}','${m[2]}','${m[3]}')">📎 ${st==="rejected"?T("إعادة الرفع","Re-upload"):T("رفع المهمة","Upload")}</button>`)});
 };

 function open(pid,d,k){
  const p=DB.projects.find(x=>x.id===pid);if(!p)return;const st=state(p,d,k);
  CALDAY=d;CALMONTH=d.slice(0,7);CALPROJECT="";
  const after=()=>{const cb=[...document.querySelectorAll(".daily-task input[type=checkbox]")].find(c=>(c.getAttribute("onchange")||"").includes(`'${pid}','${d}','${k}'`));const row=cb&&cb.closest(".daily-task");if(row){row.classList.add("ftd-flash");row.scrollIntoView({block:"center",behavior:"smooth"})}
   if(st.st!=="done"||st.s)doAttach(pid,d,k)};
  if(location.hash.slice(1)==="calendar"){VIEWS.calendar();setTimeout(after,60)}else{go("calendar");setTimeout(after,180)}
 }
 window.FTDASH={open,attach:doAttach,calMine(v){CALMINE=!!v;VIEWS.calendar()},itemsFor};
 try{if(ME&&$("#main")&&(location.hash.slice(1)||"dashboard").split("/")[0]==="dashboard")VIEWS.dashboard()}catch(e){}
})();
</script>

<script id="ft-plans-admin-js">
/* ===== Plans management (admin): add / edit / delete / delete all — stored in Supabase (ft_plans) ===== */
(function(){
 const T=(ar,en)=>LANG==="en"?en:ar;
 const KEYS=[["stories","Stories"],["posts","Posts"],["reels","Reels"],["design","Design"],["ads","Ads"],["content","Content"]];
 const ERR={bad_name:["اسم الباقة غير صالح (أحرف وأرقام ومسافات فقط، حتى 40 حرفاً)","Invalid plan name (letters, digits and spaces, up to 40 characters)"],exists:["يوجد باقة بنفس الاسم","A plan with this name already exists"],not_found:["الباقة غير موجودة، ربما حُذفت","Plan not found, it may have been deleted"],bad_link:["رابط PDF يجب أن يبدأ بـ https://","PDF link must start with https://"],forbidden:["هذا الإجراء متاح للمدير العام فقط","Only the general manager can do this"],bad_password:["كلمة المرور غير صحيحة","Incorrect password"],invalid:["بيانات غير صالحة","Invalid data"]};
 const errMsg=e=>{const m=ERR[e];return m?T(m[0],m[1]):T("تعذّر الحفظ","Couldn't save")};
 let LOADED=false,FAILS=0,LOCK=0;

 function setPlans(list){
  PLANS.items.splice(0,PLANS.items.length,...(Array.isArray(list)?list:[]));
  Object.keys(PLAN_TARGETS).forEach(k=>delete PLAN_TARGETS[k]);
  PLANS.items.forEach(p=>{PLAN_TARGETS[p.name]={...(p.targets||{})}});
 }
 function redraw(){
  if(!ME)return;
  const pg=(location.hash.slice(1)||"dashboard").split("/")[0];
  if(!["plans","projects","dashboard"].includes(pg))return;
  if(busy()){PENDING=true;return}
  rerender();
 }
 async function loadPlans(){
  if(!TOK)return;
  try{const r=await rpc("ft_plans_get",{p_token:TOK});if(!r||r.disabled||!Array.isArray(r.plans))return;setPlans(r.plans);LOADED=true;redraw()}catch(e){}
 }
 window.FTPLANS={load:loadPlans,set:setPlans,loaded:()=>LOADED};

 const _start=start;start=function(){const r=_start.apply(this,arguments);loadPlans();return r};
 try{SB.channel("ft-plans").on("broadcast",{event:"changed"},()=>loadPlans()).subscribe()}catch(e){}
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadPlans()});
 if(TOK&&ME)loadPlans();

 const used=n=>(DB&&DB.projects||[]).filter(x=>x.plan===n).length;

 /* ---- Plans page ---- */
 VIEWS.plans=function(){
  const adm=isAdmin(),items=PLANS.items;
  const btns=adm?`<button class="btn primary" onclick="FTPLANS.edit()">＋ ${T("إضافة باقة","Add plan")}</button>${items.length?`<button class="btn danger" onclick="FTPLANS.clearAll()">🗑 ${T("حذف جميع الباقات","Delete all plans")}</button>`:""}`:"";
  const bar=adm?`<div class="pl-adminbar"><span>🛠 ${T("إدارة الباقات","Plans management")} — <b class="en">${items.length}</b> ${T("باقة","plans")} · <b class="en">${(DB.projects||[]).length}</b> ${T("مشروع","projects")}</span><span>${T("أي تعديل يظهر فوراً لدى جميع المستخدمين","Changes appear instantly for all users")}</span></div>`:"";
  const card=p=>`<div class="card plan ${p.featured?"featured":""}">${p.badge?`<span class="badge b-plan tag">${esc(p.badge)}</span>`:""}<div class="ic">${esc(p.icon||"📦")}</div><h3>${esc(p.name)}</h3><div style="color:var(--muted);font-size:13px">${esc(p.desc)}</div><div class="pr en">${esc(p.price)} <small>${esc(p.period)}</small></div><div style="font-size:12px;color:var(--muted)">${used(p.name)} ${T("مشروع على هذه الباقة","projects on this plan")}</div><ul>${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul><div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap">${p.publicPdf?`<a class="btn sm" href="${esc(p.publicPdf)}" target="_blank" rel="noopener">📄 PDF</a>`:""}${canPublish()?`<button class="btn sm primary" onclick="projectModal(null,'${esc(p.name)}')">＋ ${T("مشروع بهذه الباقة","Project with this plan")}</button>`:""}</div>${adm?`<div class="pl-tools"><button class="btn sm" onclick="FTPLANS.edit('${esc(p.name)}')">✏️ ${T("تعديل","Edit")}</button><button class="btn sm danger" onclick="FTPLANS.del('${esc(p.name)}')">🗑 ${T("حذف الباقة","Delete plan")}</button></div>`:""}</div>`;
  const empty=`<div class="card pl-empty"><div class="ic">📦</div><h3 style="margin:0">${T("لا توجد باقات حالياً","No plans yet")}</h3><p>${adm?T("ابدأ بإضافة أول باقة لتتمكن من ربط المشاريع بها","Add your first plan so projects can be linked to it"):T("لم تتم إضافة أي باقة بعد من قبل الإدارة","Management hasn't added any plans yet")}</p>${adm?`<button class="btn primary" onclick="FTPLANS.edit()">＋ ${T("إضافة باقة","Add plan")}</button>`:""}</div>`;
  $("#main").innerHTML=header(T("باقات Fast Techno","Fast Techno Plans"),T("الباقات المعتمدة من موقع fasttechnoagency.com","Official plans from fasttechnoagency.com"),btns)+bar+(items.length?`<div class="grid plans">${items.map(card).join("")}</div>`:empty);
 };

 /* ---- Add / edit modal ---- */
 function edit(name){
  if(!isAdmin())return toast(T("غير مسموح","Not allowed"));
  const cur=name?PLANS.items.find(p=>p.name===name):null;
  if(name&&!cur)return toast(errMsg("not_found"));
  const p=cur||{name:"",icon:"📦",desc:"",price:"",period:"/ month",badge:"",featured:false,publicPdf:"",features:[],targets:{content:4,stories:8,posts:8,reels:1,design:1,ads:1}};
  const m=String(p.price||"").match(/^\s*([\d.,]+)\s*(.*)$/),amt=m?m[1].replace(/,/g,""):"",curr=(m?m[2]:"")||"JOD";
  modal(`<h3>${cur?T("تعديل الباقة","Edit plan")+" — "+esc(p.name):"＋ "+T("إضافة باقة جديدة","Add a new plan")}</h3>
  <form id="plf" class="form pl-form" autocomplete="off">
   <div><label>${T("اسم الباقة","Plan name")}</label><input id="pln" value="${esc(p.name)}" maxlength="40" placeholder="PLUTO" ${cur?"disabled":""} required>${cur?`<div class="pl-hint">${T("لا يمكن تغيير الاسم لأنه مرتبط بالمشاريع","Name can't be changed because projects are linked to it")}</div>`:""}</div>
   <div><label>${T("الأيقونة","Icon")}</label><input id="pli" value="${esc(p.icon)}" maxlength="8" placeholder="🚀"></div>
   <div><label>${T("السعر","Price")}</label><div class="pl-row"><input id="plp" dir="ltr" type="number" min="0" step="any" value="${esc(amt)}" placeholder="300" required><input id="plc" dir="ltr" class="pl-cur" value="${esc(curr)}" maxlength="8"></div></div>
   <div><label>${T("الفترة","Period")}</label><input id="plper" dir="ltr" value="${esc(p.period)}" maxlength="30" list="plperl"><datalist id="plperl"><option value="/ month"><option value="/ 3 months"><option value="/ year"><option value="one-time"></datalist></div>
   <div class="full"><label>${T("وصف مختصر","Short description")}</label><input id="pld" value="${esc(p.desc)}" maxlength="300"></div>
   <div><label>${T("الشارة (اختياري)","Badge (optional)")}</label><input id="plb" value="${esc(p.badge)}" maxlength="40" placeholder="Most popular"></div>
   <div><label>${T("رابط ملف PDF (اختياري)","PDF link (optional)")}</label><input id="plpdf" value="${esc(p.publicPdf)}" maxlength="500" placeholder="https://..." dir="ltr"></div>
   <div class="full"><label class="pl-chk"><input type="checkbox" id="plf_feat" ${p.featured?"checked":""}> ⭐ ${T("تمييز هذه الباقة (الأكثر طلباً)","Highlight this plan (most popular)")}</label></div>
   <div class="full"><label>${T("مميزات الباقة — ميزة في كل سطر","Plan features — one per line")}</label><textarea id="plfe" rows="6">${esc((p.features||[]).join("\n"))}</textarea></div>
   <div class="pl-sec">🎯 ${T("الأهداف الشهرية الافتراضية لكل مهمة (تُطبّق على المشاريع الجديدة)","Default monthly targets per task (applied to new projects)")}</div>
   <div class="pl-tg">${KEYS.map(([k,l])=>`<div><label>${l}</label><input type="number" min="0" max="999" data-tk="${k}" value="${+(p.targets?.[k]||0)}"></div>`).join("")}</div>
   <div class="full err" id="plerr"></div>
  </form><div class="actions"><button class="btn" onclick="closeModal()">${T("إلغاء","Cancel")}</button><button class="btn primary" id="plsave">${cur?T("حفظ التعديلات","Save changes"):T("إضافة الباقة","Add plan")}</button></div>`);
  setTimeout(()=>$(cur?"#pld":"#pln")?.focus(),50);
  const err=$("#plerr"),btn=$("#plsave");
  const submit=async e=>{
   e&&e.preventDefault();
   const v={name:(cur?p.name:$("#pln").value).trim(),icon:$("#pli").value.trim(),desc:$("#pld").value.trim(),period:$("#plper").value.trim(),badge:$("#plb").value.trim(),publicPdf:$("#plpdf").value.trim(),featured:$("#plf_feat").checked,features:$("#plfe").value.split("\n").map(s=>s.trim()).filter(Boolean),targets:{}};
   const a=$("#plp").value.trim(),c=$("#plc").value.trim()||"JOD";
   document.querySelectorAll("[data-tk]").forEach(i=>{v.targets[i.dataset.tk]=Math.max(0,Math.min(999,Math.floor(+i.value||0)))});
   if(!v.name)return err.textContent=T("يرجى كتابة اسم الباقة","Please enter the plan name");
   if(!/^[\p{L}\p{N} _.+-]{1,40}$/u.test(v.name))return err.textContent=errMsg("bad_name");
   if(!cur&&PLANS.items.some(x=>x.name.toLowerCase()===v.name.toLowerCase()))return err.textContent=errMsg("exists");
   if(a===""||isNaN(+a)||+a<0)return err.textContent=T("يرجى إدخال سعر صحيح","Please enter a valid price");
   if(v.publicPdf&&!/^https:\/\/\S+$/.test(v.publicPdf))return err.textContent=errMsg("bad_link");
   v.price=`${+a} ${c}`;
   btn.disabled=true;btn.textContent=T("جارٍ الحفظ…","Saving…");err.textContent="";
   let r;try{r=await rpc("ft_plan_save",{p_token:TOK,p_plan:v,p_new:!cur})}catch(x){r={error:"net"}}
   if(r&&r.disabled)return kicked();

   setPlans(r.plans);closeModal();VIEWS.plans();toast(cur?T("تم حفظ تعديلات الباقة ✓","Plan updated ✓"):T("تمت إضافة الباقة ✓","Plan added ✓"));
  };

 }

 /* ---- Delete one ---- */
 function del(name){
  if(!isAdmin())return toast(T("غير مسموح","Not allowed"));
  const p=PLANS.items.find(x=>x.name===name);if(!p)return toast(errMsg("not_found"));
  const n=used(name);
  modal(`<div class="wipe"><div class="wipe-ic">🗑</div><h3 style="margin:0 0 6px">${T("حذف الباقة","Delete plan")}</h3>
   <div class="pl-del-name">${esc(p.icon||"")} <span class="en">${esc(p.name)}</span> — <span class="en">${esc(p.price)}</span></div>
   <div class="pl-warn">${n?`<b>${T("تنبيه:","Note:")}</b> ${T(`يوجد ${n} مشروع مرتبط بهذه الباقة. لن تُحذف هذه المشاريع وستحتفظ باسم الباقة وأهدافها الحالية، لكن لن تظهر الباقة عند إنشاء مشاريع جديدة.`,`${n} project(s) use this plan. They won't be deleted and will keep the plan name and current targets, but the plan won't be available for new projects.`)}`:T("لا توجد مشاريع مرتبطة بهذه الباقة.","No projects use this plan.")}</div>
   <div class="wipe-err" id="pderr"></div>
   <div class="wipe-actions"><button type="button" class="btn" onclick="closeModal()">${T("إلغاء","Cancel")}</button><button class="btn danger-solid" id="pdgo">🗑 ${T("حذف الباقة","Delete plan")}</button></div></div>`);
  const b=$("#pdgo");
  b.onclick=async()=>{
   b.disabled=true;b.textContent=T("جارٍ الحذف…","Deleting…");
   let r;try{r=await rpc("ft_plan_delete",{p_token:TOK,p_name:name})}catch(x){r={error:"net"}}
   if(r&&r.disabled)return kicked();
   if(!r||r.error){b.disabled=false;b.textContent="🗑 "+T("حذف الباقة","Delete plan");$("#pderr").textContent=r&&r.error==="net"?T("تعذّر الاتصال بالخادم، لم يتم الحذف","Couldn't reach the server, nothing was deleted"):errMsg(r&&r.error);return}
   setPlans(r.plans);closeModal();VIEWS.plans();toast(T("تم حذف الباقة ✓","Plan deleted ✓"));
  };
 }

 /* ---- Delete all (password required) ---- */
 function clearAll(){
  if(!isAdmin())return toast(T("غير مسموح","Not allowed"));
  const total=PLANS.items.length,linked=(DB.projects||[]).filter(x=>PLANS.items.some(p=>p.name===x.plan)).length;
  modal(`<div class="wipe"><div class="wipe-ic">⚠</div><h3 style="margin:0 0 6px">${T("حذف جميع الباقات","Delete all plans")}</h3>
   <p class="wipe-sub">${T(`سيتم حذف ${total} باقة نهائياً لدى جميع المستخدمين. المشاريع الحالية (${linked}) لن تُحذف وستحتفظ بأسماء باقاتها، لكن لن تتمكن من إنشاء مشاريع جديدة حتى تضيف باقة.`,`${total} plan(s) will be permanently deleted for all users. Existing projects (${linked}) won't be deleted and keep their plan names, but no new projects can be created until you add a plan.`)}</p>
   <form id="pcf" autocomplete="off">
    <label>${T("كلمة مرور حسابك للتأكيد","Your account password to confirm")}</label><input type="password" id="pcpw" autocomplete="current-password" required>
    <label class="wipe-ack"><input type="checkbox" id="pcack"> ${T("أفهم أن جميع الباقات ستُحذف نهائياً","I understand all plans will be permanently deleted")}</label>
    <div class="wipe-err" id="pcerr"></div>
    <div class="wipe-actions"><button type="button" class="btn" onclick="closeModal()">${T("إلغاء","Cancel")}</button><button class="btn danger-solid" id="pcgo" disabled>🗑 ${T("حذف جميع الباقات","Delete all plans")}</button></div>
   </form></div>`);
  const f=$("#pcf"),pw=$("#pcpw"),ack=$("#pcack"),b=$("#pcgo"),err=$("#pcerr"),lbl="🗑 "+T("حذف جميع الباقات","Delete all plans");
  const sync=()=>{b.disabled=!(pw.value&&ack.checked)||Date.now()<LOCK};
  pw.oninput=()=>{err.textContent="";sync()};ack.onchange=sync;setTimeout(()=>pw.focus(),50);
  f.onsubmit=async e=>{
   e.preventDefault();if(!isAdmin())return;
   if(Date.now()<LOCK){err.textContent=T(`محاولات كثيرة، حاول بعد ${Math.ceil((LOCK-Date.now())/1000)} ثانية`,`Too many attempts, try again in ${Math.ceil((LOCK-Date.now())/1000)}s`);return}
   if(!pw.value||!ack.checked)return;
   const h=await sha(pw.value);
   if(h!==ME.pass){FAILS++;pw.value="";sync();
    if(FAILS>=5){FAILS=0;LOCK=Date.now()+60000;err.textContent=T("محاولات كثيرة، تم إيقاف المحاولة لمدة 60 ثانية","Too many attempts, locked for 60 seconds");setTimeout(sync,60100)}
    else err.textContent=T(`كلمة المرور غير صحيحة (${5-FAILS} محاولات متبقية)`,`Incorrect password (${5-FAILS} attempts left)`);
    return}
   b.disabled=true;b.textContent=T("جارٍ الحذف…","Deleting…");pw.disabled=true;
   let r;try{r=await rpc("ft_plans_clear",{p_token:TOK,p_hash:h})}catch(x){r={error:"net"}}
   if(r&&r.disabled)return kicked();
   if(!r||r.error){b.textContent=lbl;pw.disabled=false;pw.value="";sync();err.textContent=r&&r.error==="net"?T("تعذّر الاتصال بالخادم، لم يتم حذف أي باقة","Couldn't reach the server, nothing was deleted"):errMsg(r&&r.error);return}
   FAILS=0;setPlans([]);closeModal();VIEWS.plans();toast(T("تم حذف جميع الباقات ✓","All plans deleted ✓"));
  };
 }
 Object.assign(window.FTPLANS,{edit,del,clearAll});

 /* ---- Project modal: keep a deleted plan selected, block new projects when no plans exist ---- */
 const _pm=projectModal;
 projectModal=function(id,planName){

   sel.disabled=true;

 saveProject=function(id){

 try{if(ME&&(location.hash.slice(1)||"").split("/")[0]==="plans")VIEWS.plans()}catch(e){}

<style id="ft-departments-css">

<script id="ft-departments-js">
/* ===== Departments management: admin + supervisor can add / rename / delete extra departments (stored in Supabase: ft_departments) =====
   Built-in departments stay fixed (they are tied to the lead roles). Each added department can have its own department lead
   (lead_id = one employee of that department); the other employees report to that lead (manager_id = lead_id). Without a lead
   they report directly to the general manager and the supervisor (manager_id = null). */
(function(){
 const T=(ar,en)=>LANG==="en"?en:ar;
 const H=FTHierarchy,D=H.departments,BUILTIN=new Set(Object.keys(D));
 const CUSTOM={};let STATE="loading";/* loading | ok | missing | error */
 const KEY_RE=/^c_[a-z0-9]{4,24}$/,NAME_RE=/^[\p{L}\p{N}][\p{L}\p{N} &/()._+-]{0,39}$/u;
 const CACHE="ft_depts_cache";
 const ERR={forbidden:["إدارة الأقسام متاحة فقط للمدير العام والمسؤول","Only the general manager and supervisor can manage departments"],bad_name:["اسم القسم غير صالح (حتى 40 حرفاً: أحرف وأرقام ومسافات)","Invalid department name (up to 40 letters, digits and spaces)"],exists:["يوجد قسم بنفس الاسم","A department with this name already exists"],not_found:["القسم غير موجود، ربما حُذف","Department not found, it may have been deleted"],in_use:["لا يمكن حذف قسم فيه موظفون — انقلهم إلى قسم آخر أولاً","Can't delete a department that has employees — move them first"],bad_lead:["مسؤول القسم يجب أن يكون موظفاً نشطاً في القسم نفسه","The department lead must be an active employee of the same department"],is_lead:["هذا الموظف مسؤول القسم — اختر مسؤولاً آخر للقسم أو أزله أولاً","This employee leads the department — pick another lead or remove them first"],builtin:["الأقسام الأساسية لا يمكن تعديلها أو حذفها","Built-in departments can't be changed or deleted"],invalid:["بيانات غير صالحة","Invalid data"]};
 const errMsg=e=>{const m=ERR[e];return m?T(m[0],m[1]):T("تعذّر الحفظ","Couldn't save")};
 const canDepts=()=>Boolean(ME&&(ME.role==="admin"||ME.role==="supervisor"));
 const isCustom=k=>Object.hasOwn(CUSTOM,k);
 const members=k=>(DB&&DB.users||[]).filter(u=>u.department===k);
 const leadOf=k=>{const c=CUSTOM[k];if(!c||!c.lead_id)return null;const u=(DB&&DB.users||[]).find(x=>x.id===c.lead_id&&!x.disabled);return u&&u.department===k&&u.role==="employee"?u:null};
 const ledDept=a=>a?Object.keys(CUSTOM).find(k=>CUSTOM[k].lead_id===a.id&&a.department===k&&a.role==="employee")||null:null;
 const LEAD={management:"",it:"it_lead",marketing:"marketing_lead",design:"marketing_lead",photography:"photography_lead",legal:""};

 function setDepts(list){
  Object.keys(CUSTOM).forEach(k=>{delete CUSTOM[k];if(!BUILTIN.has(k))delete D[k]});
  (Array.isArray(list)?list:[]).forEach(d=>{
   if(!d||!KEY_RE.test(d.key||"")||BUILTIN.has(d.key)||typeof d.name!=="string")return;
   const name=d.name.trim().slice(0,40);if(!name)return;
   CUSTOM[d.key]={key:d.key,name,lead_id:typeof d.lead_id==="string"&&d.lead_id?d.lead_id:null,created_at:d.created_at||null};D[d.key]=name;
  });
  try{sessionStorage.setItem(CACHE,JSON.stringify(Object.values(CUSTOM)))}catch(e){}
 }
 try{setDepts(JSON.parse(sessionStorage.getItem(CACHE)||"[]"))}catch(e){}

 function redraw(){
  if(!ME)return;
  const pg=(location.hash.slice(1)||"dashboard").split("/")[0];
  if(!["departments","team","hub"].includes(pg))return;
  if(busy()){PENDING=true;return}
  rerender();
 }
 async function load(){
  if(!TOK)return;
  try{const r=await rpc("ft_depts_get",{p_token:TOK});if(!r||r.disabled)return;if(r.error){STATE="error";return redraw()}setDepts(r.departments);STATE="ok";try{buildNav()}catch(e){}redraw()}
  catch(x){STATE=(x&&(x.code==="PGRST202"||/ft_depts_get/.test(x.message||"")))?"missing":"error";redraw()}
 }
 const ping=()=>{try{SB.channel("ft-depts").send({type:"broadcast",event:"changed",payload:{}})}catch(e){}};

 /* ---- Rules: employees of an added department report to its lead (or directly to admin + supervisor when it has none) ---- */
 const _va=H.validAssignment;
 H.validAssignment=function(user,users){
  if(user&&isCustom(user.department)){
   if(user.role!=="employee")return false;
   const c=CUSTOM[user.department];
   if(!c.lead_id||c.lead_id===user.id)return !user.manager_id;
   return user.manager_id===c.lead_id;
  }
  return _va.apply(this,arguments);
 };
 /* the lead of an added department manages only the employees of that department who report to them */
 const _cm=H.canManage,_cmt=H.canManageTeam;
 H.canManage=function(actor,target){
  const k=ledDept(actor);
  if(k&&target&&actor.id!==target.id)return target.role==="employee"&&target.department===k&&target.manager_id===actor.id;
  return _cm.apply(this,arguments);
 };
 H.canManageTeam=function(actor){return Boolean(ledDept(actor))||_cmt.apply(this,arguments)};
 const _cn=H.canNote;
 H.canNote=function(actor,target){if(ledDept(actor))return Boolean(target&&H.canManage(actor,target));return _cn.apply(this,arguments)};
 H.teamOf=function(actor,users){return (users||[]).filter(u=>H.canNote(actor,u))};
 H.leadOfDept=leadOf;H.ledDept=ledDept;

 /* ---- Employee form: added departments are selectable by admin + supervisor ---- */
 const _um=userModal;
 userModal=function(id){
  const r=_um.apply(this,arguments);
  const sel=$("#ud");if(!sel||!canDepts())return r;
  const keys=Object.keys(CUSTOM);
  if(keys.length){
   [...sel.options].forEach(o=>{if(isCustom(o.value))o.remove()});
   const g=document.createElement("optgroup");g.label=T("أقسام مضافة","Added departments");
   const u=id?DB.users.find(x=>x.id===id):null;
   keys.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=CUSTOM[k].name;if(u&&u.department===k)o.selected=true;g.appendChild(o)});
   sel.appendChild(g);
   /* role list: "مسؤول <قسم مضاف>" for every added department */
   const ur=$("#ur");
   if(ur){
    [...ur.querySelectorAll('option[value^="lead:"]')].forEach(o=>o.remove());
    const g2=document.createElement("optgroup");g2.label=T("مسؤولو الأقسام المضافة","Added department leads");
    keys.forEach(k=>{const o=document.createElement("option");o.value="lead:"+k;o.textContent=roleName(k);const L=leadOf(k);if(u&&L&&L.id===u.id)o.selected=true;g2.appendChild(o)});
    ur.appendChild(g2);
   }
  }
  const um=$("#um");if(um)um.dataset.uid=id||"";
  const lbl=sel.previousElementSibling;
  if(lbl&&!lbl.querySelector(".dp-add"))lbl.insertAdjacentHTML("beforeend",` <a href="#" class="dp-add" style="font-size:11px;font-weight:600" onclick="closeModal();go('departments');return false">＋ ${T("قسم جديد","New department")}</a>`);
  syncUserForm();
  return r;
 };
 const _suf=syncUserForm;
 syncUserForm=function(){
  const r=_suf.apply(this,arguments);
  const d=$("#ud"),m=$("#um"),rv=$("#ur")?$("#ur").value:"";
  const old=$("#urHint");if(old)old.remove();
  if(d&&m&&rv.startsWith("lead:")&&isCustom(rv.slice(5))){
   const k=rv.slice(5),L=leadOf(k),self=L&&L.id===(m.dataset.uid||"");
   d.value=k;d.disabled=true;
   m.innerHTML=`<option value="">${T("— يتبع مباشرة للمدير العام والمسؤول","— Reports directly to the general manager and supervisor")}</option>`;m.value="";m.disabled=true;m.dataset.locked="1";
   m.insertAdjacentHTML("afterend",`<div class="pl-hint" id="urHint">${L&&!self?T(`سيصبح مسؤول ${esc(CUSTOM[k].name)} بدلاً من ${esc(L.name)}، ويتبعه ${esc(L.name)} وباقي موظفي القسم.`,`Will lead ${esc(CUSTOM[k].name)} instead of ${esc(L.name)}; ${esc(L.name)} and the rest of the department will report to them.`):T(`سيتبعه جميع موظفي ${esc(CUSTOM[k].name)}، ويرى فريقه ويضيف ملاحظاته ويوزّع عليهم المهام، ويرفع مهامه هو فقط.`,`Everyone in ${esc(CUSTOM[k].name)} will report to them; they see the team, add notes and assign tasks, but upload only their own tasks.`)}</div>`);
   return r;
  }
  if(d&&m&&isCustom(d.value)){
   const L=leadOf(d.value),self=L&&L.id===(m.dataset.uid||"");
   m.innerHTML=L&&!self?`<option value="${esc(L.id)}">${esc(L.name)} — ${T("مسؤول القسم","Department lead")}</option>`
    :self?`<option value="">${T("— سيتوقف عن كونه مسؤول القسم ويتبع مباشرة للمدير العام والمسؤول","— Will stop leading the department and report directly to the general manager and supervisor")}</option>`
    :`<option value="">${T("— لا يوجد مسؤول للقسم: يتبع مباشرة للمدير العام والمسؤول","— No department lead: reports directly to the general manager and supervisor")}</option>`;
   m.value=L&&!self?L.id:"";m.disabled=!(L&&!self);
   if(m.disabled)m.dataset.locked="1";else delete m.dataset.locked;

<script id="ft-strict-ownership-js">
/* ===== Strict task ownership (v9) =====
   Rule: an employee can upload proof ONLY for a task assigned to them, and only in its own slot
   (its project, its task type, a day inside the project's dates, not in the future, with a target > 0).
   Unassigned tasks are locked for everyone except the roles listed in OWN_BYPASS_ROLES. */
(function(){
 const OWN_BYPASS_ROLES=["admin","supervisor"]; /* roles allowed to upload on behalf of others */
 const L=(ar,en)=>LANG==="en"?en:ar;
 const bypass=()=>!!ME&&OWN_BYPASS_ROLES.includes(ME.role);
 const ownersOf=p=>k=>window.FTMT&&FTMT.list?FTMT.list(p,k):[p?.assign?.[k]].filter(Boolean);
 const proj=pid=>(DB&&DB.projects||[]).find(x=>x.id===pid);
 const name=id=>(DB.users.find(u=>u.id===id)||{}).name||L("موظف آخر","another employee");
 /* returns null when allowed, otherwise an error code */
 function check(pid,d,k){
  if(!ME||!DB)return "session";
  const p=proj(pid);if(!p)return "project";
  if(!TASKS.some(t=>t[0]===k))return "invalid";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d||"")))return "invalid";
  if(d>today())return "future";
  if(bypass())return null;
  const o=ownersOf(p)(k);
  if(!o.length)return "unassigned";
  if(!o.includes(ME.id))return "other";
  if(!p.start||!p.end||d<p.start||d>p.end)return "range";
  if(!(+(p.targets?.[k]||0)))return "notarget";
  return null;
 }
 function msg(code,pid,k){
  const p=proj(pid),o=p?ownersOf(p)(k):[];
  return ({
   session:L("انتهت الجلسة، سجّل الدخول مجدداً","Session expired, sign in again"),
   project:L("المشروع غير موجود","Project not found"),
   invalid:L("بيانات غير صالحة","Invalid data"),
   future:L("لا يمكن إنجاز مهمة مستقبلية","You can't complete a future task"),
   unassigned:L("🔒 هذه المهمة غير مسندة إليك بعد — لا يمكنك رفعها حتى يسندها إليك مسؤول الفريق","🔒 This task isn't assigned to you — you can't upload it until your team lead assigns it to you"),
   other:L("🔒 هذه المهمة مسندة إلى ","🔒 This task is assigned to ")+o.map(name).join(L("، ",", "))+L(" — يمكنك رفع مهامك فقط"," — you can only upload your own tasks"),
   range:L("🔒 هذا اليوم خارج فترة المشروع","🔒 This day is outside the project period"),
   notarget:L("🔒 هذه المهمة غير مطلوبة في باقة هذا المشروع","🔒 This task is not part of this project's plan")
  })[code]||L("غير مسموح","Not allowed");
 }
 const canReview=()=>!!ME&&FTHierarchy.canManageTeam(ME);
 window.FTOWN={check,msg,bypass};

 /* 1) Upload entry point */
 const BASE=window.attachModal;
 const guarded=function(pid,d,k){
  if(!ME||!DB)return;
  const s=window.FTWF&&FTWF.subOf?FTWF.subOf(pid,d,k):null;
  const ownRejected=s&&s.status==="rej_emp"&&s.user_id===ME.id;
  if(s&&!ownRejected){ /* already uploaded: view only, for its uploader and reviewers */
   if(s.user_id===ME.id||canReview()||bypass())return FTWF.review(pid,d,k);
   return toast(msg("other",pid,k));
  }
  const e=check(pid,d,k);if(e)return toast(msg(e,pid,k));
  const r=BASE.apply(this,arguments);
  /* re-check at the moment of sending, with the latest assignment */
  const btn=document.querySelector("#pfGo");
  if(btn&&btn.onclick){const send=btn.onclick;btn.onclick=async function(ev){
   try{const latest=await rpc("ft_get",{p_token:TOK});if(latest&&!latest.error)apply(latest)}catch(_){}
   const e2=check(pid,d,k);if(e2){const er=document.querySelector("#pfErr");if(er)er.textContent=msg(e2,pid,k);return}
   return send.call(this,ev)}}
  return r;
 };
 window.attachModal=guarded;
 if(window.FTWF)FTWF.attach=guarded;
 if(window.FTDASH)FTDASH.attach=guarded;

 /* 2) Tick entry points (project table + calendar) */
 window.tick=function(pid,d,k){if(d>today())return toast(msg("future"));guarded(pid,d,k)};
 window.calendarTick=function(pid,d,k){if(d>today())return;guarded(pid,d,k);setTimeout(()=>{if(!$("#modalRoot").innerHTML)VIEWS.calendar()},50)};

 /* 3) Last line of defence before the server: block uploads / direct ticks for tasks that aren't yours */
 const RPC=window.rpc;
 try{if(DB&&DB.tracker)window.__FT_TRK_SNAP=JSON.parse(JSON.stringify(DB.tracker))}catch(_){}
 window.rpc=async function(fn,args){
  if(fn==="ft_sub_create"&&args){const e=check(args.p_project,args.p_day,args.p_key);if(e)return{error:e==="other"||e==="unassigned"?"not_assigned":"forbidden"}}
  if(fn==="ft_save"&&args&&args.p_scope&&Array.isArray(args.p_scope.tracker)&&!bypass()&&window.__FT_TRK_SNAP){
   /* direct check-marks are only allowed by managers; employees must upload proof */
   const snap=window.__FT_TRK_SNAP;
   for(const pid of args.p_scope.tracker){const now=(args.p_data&&args.p_data.tracker||{})[pid]||{},was=snap[pid]||{};
    for(const d of new Set([...Object.keys(now),...Object.keys(was)]))for(const [k] of TASKS)if(!!(now[d]||{})[k]!==!!(was[d]||{})[k])return{error:"forbidden"}}
  }
  const r=await RPC.apply(this,arguments);
  if(r&&r.data&&r.data.tracker)try{window.__FT_TRK_SNAP=JSON.parse(JSON.stringify(r.data.tracker))}catch(_){}
  return r;
 };

 /* 4) Project table: lock every cell that isn't yours */
 const _tv=window.trackerView;
 window.trackerView=function(id){
  _tv.apply(this,arguments);const p=proj(id);if(!p||!ME)return;
  if(bypass())return;
  const own=ownersOf(p),mineKeys=TASKS.filter(([k])=>own(k).includes(ME.id)&&+(p.targets?.[k]||0)).map(([k])=>k);
  document.querySelectorAll(".trk .cb").forEach(el=>{
   const m=(el.getAttribute("onclick")||"").match(/'([^']+)','([^']+)','([^']+)'/);if(!m)return;
   const e=check(m[1],m[2],m[3]);
   if(e==="other"||e==="unassigned"||e==="range"||e==="notarget"){el.classList.add("cb-lock");el.classList.remove("cb-mine");el.title=msg(e,m[1],m[3]).replace("🔒 ","")}
   else if(!e){el.classList.add("cb-mine");el.title=L("مهمتك — انقر لرفع الإثبات","Your task — click to upload proof")}
  });
  const tbl=document.querySelector(".trk");
  if(tbl&&!document.querySelector(".own-banner"))tbl.closest(".card").insertAdjacentHTML("beforebegin",`<div class="own-banner">${mineKeys.length
   ?L("🔒 يمكنك رفع مهامك فقط في هذا المشروع: ","🔒 You can only upload your own tasks in this project: ")+mineKeys.map(k=>`<b>${esc(TNAME(k))}</b>`).join(" · ")
   :L("🔒 لا توجد مهام مسندة إليك في هذا المشروع — لا يمكنك رفع أي مهمة هنا","🔒 No tasks are assigned to you in this project — you can't upload anything here")}</div>`);
 };

 /* 5) Calendar: disable tasks that aren't yours */
 const _cal=VIEWS.calendar;
 VIEWS.calendar=function(){
  _cal.apply(this,arguments);if(!ME||bypass())return;
  document.querySelectorAll(".daily-task").forEach(row=>{
   const cb=row.querySelector("input[type=checkbox]");if(!cb)return;
   const m=(cb.getAttribute("onchange")||"").match(/'([^']+)','([^']+)','([^']+)'/);if(!m)return;
   const e=check(m[1],m[2],m[3]);
   if(e==="other"||e==="unassigned"||e==="range"||e==="notarget"){
    cb.disabled=true;cb.onclick=ev=>ev.preventDefault();row.classList.add("own-locked");
    row.querySelectorAll(".ftd-up").forEach(b=>b.remove());
    if(e==="unassigned"&&!row.querySelector(".own-un"))row.insertAdjacentHTML("beforeend",`<span class="badge b-mut own-un">🔒 ${L("غير مسندة","Unassigned")}</span>`);
   }
  });
 };

 /* refresh the current screen so the new rules apply immediately */
 try{if(ME&&$("#main")&&typeof rerender==="function")rerender()}catch(_){}
})();
</script>

.own-banner{margin:0 0 12px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--glass);font-size:13px;color:var(--muted)}
.own-banner b{color:var(--ok)}
.daily-task.own-locked{opacity:.55}
.daily-task.own-locked input[type=checkbox]{cursor:not-allowed}
</style>
