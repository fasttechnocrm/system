<style>
:root,html[data-theme="dark"]{--input-bg:rgba(5,7,15,.6);--aside-bg:rgba(5,7,15,.75);--feat:var(--feat);--star-off:var(--star-off);--track:rgba(255,255,255,.06);--hover:rgba(255,255,255,.015);--pop-shadow:0 20px 60px rgba(0,0,0,.6);--bg:#05070F;--bg-2:#0B1120;--surface-1:rgba(14,20,36,.72);--surface-2:rgba(20,28,48,.85);--cyan:#3FD4FF;--blue:#3A7BFF;--violet:#6C7CFF;--white:#EEF3FB;--muted:#8A97AD;--glass:rgba(255,255,255,.035);--line:rgba(150,170,205,.12);--line-strong:rgba(150,170,205,.22);--grad:linear-gradient(120deg,#5FE0FF,#3A7BFF 60%,#6C7CFF);--ok:#2fd18b;--warn:#ffb547;--bad:#ff5d6c;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);background-image:radial-gradient(900px 500px at 85% -10%,rgba(58,123,255,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(63,212,255,.08),transparent 60%);background-attachment:fixed}
.en{font-family:'Space Grotesk','Cairo',sans-serif}
a{color:var(--cyan)}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--glass);color:var(--white);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px -8px rgba(58,123,255,.6)}
.btn.danger{border-color:rgba(255,93,108,.4);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,select,textarea{width:100%;background:var(--input-bg);border:1px solid var(--line-strong);color:var(--white);border-radius:11px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,212,255,.12)}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
.password-field{position:relative;width:100%}
.password-field input{padding-left:52px}
.password-field .password-toggle{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:40px;height:36px;padding:0;justify-content:center;border:0;background:transparent;color:var(--muted);border-radius:8px}
.password-field .password-toggle:hover{transform:translateY(-50%);color:var(--cyan);background:var(--glass)}
.password-toggle:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.password-toggle svg{width:20px;height:20px;pointer-events:none}
@media(max-width:480px){.modal .form .password-field input{padding-left:52px}}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{overflow-wrap:anywhere}
.tbl,.card{max-width:100%}
.tbl{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#ft-backdrop{position:fixed;inset:0;background:rgba(2,4,10,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s ease}
#ft-backdrop.show{opacity:1;pointer-events:auto}
html[data-theme="light"] #ft-backdrop{background:rgba(11,21,48,.3)}
@media (max-width:1200px){.hub-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
 aside{width:min(300px,86vw);transition:transform .35s cubic-bezier(.22,1,.36,1),background-color .3s;box-shadow:none;background:var(--bg-2)}
 aside.open{box-shadow:var(--pop-shadow)}
 aside.dragging{transition:none}
 body.ft-lock{overflow:hidden;touch-action:none}
 .top{position:sticky;top:0;z-index:30;margin:-26px calc(-1*clamp(16px,3vw,36px)) 18px;padding:calc(12px + env(safe-area-inset-top)) clamp(16px,3vw,36px) 12px;background:var(--aside-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
 .menu-btn{min-width:42px;min-height:42px;justify-content:center;font-size:18px}
 .grid[style*="grid-template-columns"]{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))!important}
 #npanel{top:auto;bottom:0;left:0!important;right:0!important;width:100%;max-height:80dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}
@media (max-width:600px){
 main{padding:18px 14px calc(22px + env(safe-area-inset-bottom))}
 .top{margin:-18px -14px 14px;padding-inline:14px}
 .top h2{font-size:18px}.top p{font-size:12px;margin:2px 0 0}
 .top>div:last-child{width:100%;justify-content:flex-start}
 .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
 .hub-row{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ph h3{font-size:18px}
 .actions{flex-wrap:wrap}.actions .btn{flex:1 1 auto;justify-content:center}
 .toolbar>*{flex:1 1 140px;min-width:0}
 .modal{padding:10px;align-items:end}
 .modal .card{max-height:calc(100dvh - 20px);border-radius:18px}
 .toast{left:12px!important;right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
 input,select,textarea{font-size:16px!important}
}
@media (max-width:360px){.hub-row{grid-template-columns:1fr}.btn{padding:8px 12px}}
@media (max-height:520px) and (orientation:landscape){aside{padding-top:10px}aside .brand{padding-bottom:10px;margin-bottom:6px}#nav a{padding:8px 12px;min-height:36px}}
@media (hover:none){.btn:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
<style id="ft-mobile-pro">
/* ===== Mobile Pro layer ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%}
input,select,textarea,button{max-width:100%;font-family:inherit}
.card{min-width:0;overflow-wrap:anywhere}
.btn{min-height:40px;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:34px}
@media (max-width:900px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat .n{font-size:24px}
 .card{padding:16px}
 .modal .card{width:100%}
 .toolbar input,.toolbar select{min-width:0}
}
@media (max-width:640px){
 body{font-size:14px}
 .card{padding:14px;border-radius:14px}
 .grid{gap:12px}
 .stats{gap:10px}
 .stat .n{font-size:22px}.stat .l{font-size:12px}
 .top{gap:8px}
 .top>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
 .top>div:last-child .btn{flex:1 1 auto}
 .btn{min-height:44px;padding:10px 14px;border-radius:12px;font-size:14px}
 .btn.sm{min-height:38px;padding:7px 12px;font-size:13px}
 .toolbar{gap:8px}
 .toolbar>*{flex:1 1 100%!important;width:100%}
 input,select,textarea{min-height:44px}
 input[type=checkbox],input[type=radio]{min-height:auto}
 .form{grid-template-columns:1fr!important}
 .modal{padding:0;align-items:end}
 .modal .card{max-height:92dvh;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:ftSheet .3s cubic-bezier(.22,1,.36,1)}
 .modal .actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg-2);padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-bottom:0;z-index:2}
 /* tables -> cards */
 .tbl.ft-cards{overflow:visible}
 table.ft-cards thead{display:none}
 table.ft-cards,table.ft-cards tbody{display:block;width:100%}
 table.ft-cards tr{display:block;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-1)}
 table.ft-cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:end;border:0;padding:7px 0;white-space:normal;overflow-wrap:anywhere;font-size:13.5px}
 table.ft-cards td+td{border-top:1px dashed var(--line)}
 table.ft-cards td[data-label]:not([data-label=""])::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:start;flex:none;max-width:45%}
 table.ft-cards td>*:only-child{margin-inline-start:auto}
 table.ft-cards td:has(.btn){flex-wrap:wrap;justify-content:flex-end}
 table.ft-cards td[colspan]{justify-content:center;text-align:center}
 table.ft-cards td[colspan]::before{display:none}
 /* wide tables that stay scrollable */
 .tbl:not(.ft-cards){margin-inline:-14px;padding-inline:14px;scroll-snap-type:x proximity}
 .tbl:not(.ft-cards) th,.tbl:not(.ft-cards) td{padding:9px 8px;font-size:12.5px;white-space:nowrap}
 .tbl:not(.ft-cards) th:first-child,.tbl:not(.ft-cards) td:first-child{position:sticky;inset-inline-start:0;background:var(--bg-2);z-index:1}
 .cal-day.btn{min-height:0}
 #npanel{max-height:85dvh}
}
@media (max-width:380px){
 .stats{grid-template-columns:1fr 1fr}
 .stat .n{font-size:19px}
 main{padding-inline:10px}
 .top{margin-inline:-10px;padding-inline:10px}
 .top h2{font-size:16px}
}
@keyframes ftSheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
<style id="ft-mobile-root-fix">
/* Root fix: on phones/tablets the sidebar is an off-canvas drawer, so the page must use the full width */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
img,video,canvas,svg,iframe{max-width:100%}
@media (max-width:900px){
 #app{display:block!important;grid-template-columns:none!important;width:100%!important;max-width:100vw}
 #app>main,#main{display:block;width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;grid-column:auto!important}
 #main>*:not(.top){max-width:100%;min-width:0}
 .top{max-width:none!important;width:auto!important}
 .card,.grid,.toolbar,.form,.hub-m,.calendar-layout{min-width:0;max-width:100%}
 .table-wrap,.tbl,[class*="table"]{max-width:100%}
 table{max-width:100%}
}
@media (max-width:600px){
 main,#main{padding-inline:12px!important}
 .top{margin:-18px -12px 16px!important;padding-inline:12px!important}
}
@media (max-width:380px){
 main,#main{padding-inline:10px!important}
 .top{margin-inline:-10px!important;padding-inline:10px!important}
}
@media (min-width:641px){
 .tbl th{white-space:nowrap}
 .tbl td{overflow-wrap:normal;word-break:normal}
 .tbl td .badge,.tbl td .pill,.tbl td b{white-space:nowrap}
}
@media (min-width:641px) and (max-width:1200px){
 .grid:has(.tbl){grid-template-columns:minmax(0,1fr)!important}
}
</style>
<style id="ft-mobile-ux">
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#ft-tabbar{display:none}
@media (max-width:900px){
 input,select,textarea{font-size:16px!important}
 html{scroll-behavior:smooth}
 main,#main{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
 .top{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
 .top h2{font-size:18px;line-height:1.3}
 .top p{font-size:12px;opacity:.8;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
 .card{border-radius:16px;transition:transform .15s}
 .card h3{font-size:16px}
 .stat{border-radius:14px}
 #nav a{min-height:48px;font-size:15px;border-radius:12px}
 aside{width:min(84vw,300px)!important;box-shadow:0 0 40px rgba(0,0,0,.5);overflow-y:auto;-webkit-overflow-scrolling:touch}
 #ft-tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:35;height:62px;padding:6px;gap:4px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line-strong);box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
 #ft-tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:14px;background:transparent;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .15s;touch-action:manipulation}
 #ft-tabbar button .i{font-size:19px;line-height:1}
 #ft-tabbar button span.t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
 #ft-tabbar button.on{color:var(--white);background:linear-gradient(120deg,rgba(95,224,255,.16),rgba(58,123,255,.22))}
 #ft-tabbar button:active{transform:scale(.92)}
 body.ft-lock #ft-tabbar,body:has(.modal.show) #ft-tabbar,body:has(.modal[style*="flex"]) #ft-tabbar{opacity:0;pointer-events:none}
 #live{bottom:calc(82px + env(safe-area-inset-bottom))!important;left:12px!important;font-size:11px!important;padding:4px 10px!important;opacity:.85}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
@media print{#ft-tabbar{display:none!important}}
</style>
</head>

/* ===== Notifications & Notes ===== */
let INBOX={notifs:[],notes:[]};
/* Original soft two-note chime; no external audio files required. */
const FTChime=(()=>{
  let ctx=null,last=-Infinity;
  function unlock(){
    try{
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx)return;
      if(!ctx||ctx.state==='closed')ctx=new AudioCtx();
      if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    }catch(e){}
  }
  function play(){
    if(!ctx||ctx.state!=='running'||performance.now()-last<1500)return;
    last=performance.now();
    try{
      const start=ctx.currentTime;
      [[659.25,0],[880,0.16]].forEach(([frequency,offset])=>{
        const oscillator=ctx.createOscillator(),gain=ctx.createGain();
        oscillator.type='sine';oscillator.frequency.value=frequency;
        gain.gain.setValueAtTime(0,start+offset);
        gain.gain.linearRampToValueAtTime(0.12,start+offset+0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001,start+offset+0.65);
        oscillator.connect(gain);gain.connect(ctx.destination);
        oscillator.start(start+offset);oscillator.stop(start+offset+0.7);
        oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
      });
    }catch(e){}
  }
  document.addEventListener('pointerdown',unlock,{passive:true});

<script>
/* Shared enhancement for initial and dynamically rendered password fields. */
(function () {
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3 3.7M6.3 6.3A20 20 0 0 0 2 12s3.5 7 10 7a13 13 0 0 0 5.7-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function update(input, button) {
    const shown = input.type === 'text';
    const english = document.documentElement.lang === 'en';
    const label = english ? (shown ? 'Hide password' : 'Show password') : (shown ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
    button.setAttribute('aria-pressed', String(shown));
    button.innerHTML = shown ? eyeOff : eye;
  }
  let counter = 0;
  function enhance() {
    document.querySelectorAll('input[type="password"]').forEach(input => {
      if (input.closest('.password-field')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'password-field';
      input.before(wrapper);
      wrapper.append(input);
      if (!input.id) input.id = 'password-field-' + (++counter);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn password-toggle';
      button.setAttribute('aria-controls', input.id);
      button.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        update(input, button);
      });
      wrapper.append(button);
      update(input, button);
    });
  }
  enhance();
  new MutationObserver(enhance).observe(document.body, { childList: true, subtree: true });
  new MutationObserver(() => {
    document.querySelectorAll('.password-field').forEach(wrapper => {
      const input = wrapper.querySelector('input');
      const button = wrapper.querySelector('.password-toggle');
      if (input && button) update(input, button);
    });
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
})();
</script>

  modal(`<h3 style="margin-top:0">📎 إرفاق إثبات الإنجاز</h3><p style="color:var(--muted);font-size:13px">${esc(p?.client||"")} — ${esc(TNAME(k))} — ${d}<br>لن يُحتسب الـ Check إلا بعد إرفاق ملف واعتماده من مسؤول الفريق ثم المسؤول ثم المدير العام.</p>
  ${s?`<div class="wf-rej">❌ مرفوضة: ${esc((s.history||[]).slice(-1)[0]?.note||"")}</div>`:""}
  <input type="file" id="pfFiles" multiple accept="image/*,video/*,application/pdf,text/plain,.txt,.pdf"><label style="margin-top:10px">وصف ما تم إنجازه</label><textarea id="pfNote" rows="3" placeholder="مثال: تم تنزيل ستوري عرض الخصم..."></textarea>
  <div id="pfErr" style="color:var(--bad);font-size:13px;margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="pfGo">رفع للمراجعة</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
  $("#pfGo").onclick=async()=>{
    const fl=[...$("#pfFiles").files];if(!fl.length)return $("#pfErr").textContent="يجب إرفاق ملف واحد على الأقل";if(fl.length>10)return $("#pfErr").textContent="الحد 10 ملفات";
    $("#pfGo").disabled=true;$("#pfGo").textContent="جارٍ الرفع…";
    try{const c=SBH(),files=[];for(const f of fl){const path=`${ME.id}/${pid}/${Date.now()}-${Math.random().toString(36).slice(2,6)}-${f.name.replace(/[^\w.\-]/g,"_")}`;const {error}=await c.storage.from("ft-proofs").upload(path,f,{contentType:f.type||"application/octet-stream"});if(error)throw new Error("up");files.push({path,name:f.name,type:f.type})}
      const r=await rpc("ft_sub_create",{p_token:TOK,p_project:pid,p_day:d,p_key:k,p_files:files,p_note:$("#pfNote").value.trim()});if(r.error)throw new Error(r.error);
      closeModal();toast(r.status==="approved"?"تم الاعتماد ✓":"تم الرفع، بانتظار الموافقة");await loadSubs();await refresh(true);rerender();
    }catch(e){$("#pfGo").disabled=false;$("#pfGo").textContent="رفع للمراجعة";$("#pfErr").textContent=ERR[e.message]||(e.message==="up"?"تعذّر رفع الملف":"تعذّر الحفظ")}
  };
}
function canAct(s){if(!s||!ME)return false;const lead=DB.users.find(u=>u.id===s.user_id)?.manager_id;
  return (["lead","ret_lead"].includes(s.status)&&(lead===ME.id||isAdmin()))||(["sup","ret_sup"].includes(s.status)&&isMgr())||(s.status==="admin"&&isAdmin())}
function reviewModal(pid,d,k){
  const s=subOf(pid,d,k),p=DB.projects.find(x=>x.id===pid);if(!s)return;const act=canAct(s),fix=/^ret_/.test(s.status);
  modal(`<h3 style="margin-top:0">${esc(TNAME(k))} — ${esc(p?.client||"")}</h3><div class="meta" style="margin-bottom:10px"><span>الموظف: <b>${esc(uName(s.user_id))}</b></span><span>التاريخ: <b class="en">${d}</b></span><span class="badge ${STG[s.status]?.[1]}">${STG[s.status]?.[0]||s.status}</span>${score(s)!=null?`<span>التقييم: <b>${score(s)}%</b></span>`:""}</div>
  ${s.note?`<p>📝 ${esc(s.note)}</p>`:""}<div class="pf-files" id="pfShow">جارٍ تحميل الملفات…</div><h4>سجل الموافقات</h4>${histHtml(s)}
  ${act?`<label>${fix?"التعديلات المطلوبة للمرحلة السابقة":"ملاحظاتك (إلزامية عند الرفض)"}</label><textarea id="rvNote" rows="3"></textarea>`:""}
  ${isMgr()?`<label>تقييمك للمهمة %</label><div style="display:flex;gap:8px"><input id="rvScore" type="number" min="0" max="100" value="${(isAdmin()?s.adm_pct:s.sup_pct)??""}"><button class="btn" onclick="FTWF.rate(${s.id})">حفظ التقييم</button></div>`:""}
  <div id="rvErr" style="color:var(--bad);font-size:13px"></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${act?(fix?`<button class="btn primary" onclick="FTWF.act(${s.id},'forward')">↩ إعادة توجيه</button>`:`<button class="btn primary" onclick="FTWF.act(${s.id},'approve')">✓ Approve</button><button class="btn" style="color:var(--bad)" onclick="FTWF.act(${s.id},'reject')">✕ Reject</button>`):""}${s.status==="rej_emp"&&s.user_id===ME.id?`<button class="btn primary" onclick="closeModal();FTWF.attach('${pid}','${d}','${k}')">إعادة الرفع</button>`:""}${isAdmin()?`<button class="btn" onclick="FTWF.cancel(${s.id})">إلغاء المهمة</button>`:""}<button class="btn" onclick="closeModal()">إغلاق</button></div>`);
  filesHtml(s.files,$("#pfShow"));
}
async function act(id,a){const note=$("#rvNote")?.value.trim()||"";if(a!=="approve"&&!note)return $("#rvErr").textContent="اكتب سبب الرفض والتعديلات المطلوبة";
  try{const r=await rpc("ft_sub_act",{p_token:TOK,p_id:id,p_act:a,p_note:note});if(r.error)return $("#rvErr").textContent=ERR[r.error]||"تعذّر";const sc=$("#rvScore")?.value;if(sc!==undefined&&sc!=="")await rpc("ft_sub_rate",{p_token:TOK,p_id:id,p_pct:+sc,p_note:note});closeModal();toast("تم ✓");await loadSubs();await refresh(true);rerender()}catch(e){toast("تعذّر الحفظ")}}
FTWF.rate=async id=>{const v=$("#rvScore").value;if(v===""||+v<0||+v>100)return $("#rvErr").textContent="التقييم بين 0 و 100";const r=await rpc("ft_sub_rate",{p_token:TOK,p_id:id,p_pct:+v,p_note:$("#rvNote")?.value||""});if(r.error)return $("#rvErr").textContent=ERR[r.error]||"تعذّر";toast("تم حفظ التقييم");await loadSubs();closeModal();rerender()};
FTWF.cancel=async id=>{if(!confirm("إلغاء هذه المهمة؟"))return;await rpc("ft_sub_cancel",{p_token:TOK,p_id:id});closeModal();await loadSubs();await refresh(true);rerender()};
FTWF.act=act;FTWF.review=reviewModal;FTWF.attach=attachModal;

/* ---------- Detailed progress ---------- */
const _tv=window.trackerView;window.trackerView=function(id){_tv(id);const p=DB.projects.find(x=>x.id===id);if(!p)return;
  document.querySelectorAll(".trk .cb").forEach(el=>{const m=(el.getAttribute("onclick")||"").match(/'([^']+)','([^']+)','([^']+)'/);if(!m)return;const s=subOf(m[1],m[2],m[3]);if(s&&s.status!=="approved"){el.classList.add(/^(rej|ret)/.test(s.status)?"cb-rej":"cb-pend");el.title=STG[s.status][0]+" — "+uName(s.user_id)}});
  const subs=allSubs().filter(x=>x.p.id===id);
  const rows=TASKS.map(([k,e,a])=>{const g=+(p.targets?.[k]||0),ap=countDone(DB.tracker[id]||{},k),pe=subs.filter(x=>x.k===k&&!["approved","rej_emp"].includes(x.s.status)).length,rj=subs.filter(x=>x.k===k&&x.s.status==="rej_emp").length,pc=g?Math.min(100,Math.round(ap/g*100)):0;
    return `<div class="pg-row"><div class="pg-h"><b>${e} <small>${a}</small></b><span class="en">${ap}/${g} · ${pc}%</span></div><div class="bar pg-bar"><i style="width:${pc}%"></i><em style="width:${g?Math.min(100-pc,pe/g*100):0}%"></em></div><small>✓ معتمدة ${ap} · ⏳ قيد المراجعة ${pe} · ✕ مرفوضة ${rj} · المتبقي ${Math.max(0,g-ap)}</small></div>`}).join("");
  const sc=subs.map(x=>score(x.s)).filter(v=>v!=null);
  document.querySelector("#main .card").insertAdjacentHTML("afterend",`<div class="card" style="margin-bottom:16px"><h3 style="margin:0 0 12px">📊 تفاصيل التقدم</h3><div class="pg-grid">${rows}</div><div class="meta" style="margin-top:10px"><span>متوسط تقييم المهام: <b>${sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)+"%":"—"}</b></span><span>تقييم المشروع العام: <b>${projPct(p)}</b></span></div></div>`)};
function projPct(p){return p.ratingPct!=null?p.ratingPct+"%":p.rating?p.rating*20+"%":"—"}
window.stars=function(v,pid){const p=pid&&DB.projects.find(x=>x.id===pid);const val=p?projPct(p):(v?v*20+"%":"—");return `<span class="pct-badge" ${pid&&isAdmin()?`onclick="FTWF.rateProject('${pid}')" style="cursor:pointer" title="تعديل"`:""}>${val}</span>`};
FTWF.rateProject=function(pid){const p=DB.projects.find(x=>x.id===pid);const v=prompt("التقييم العام للمشروع (0-100%)",p.ratingPct??"");if(v===null)return;const n=Math.max(0,Math.min(100,+v||0));p.ratingPct=n;p.rating=Math.max(1,Math.round(n/20));save()};
window.tStars=function(x){const s=subOf(x.p.id,x.d,x.k),v=score(s);return `<span class="pct-badge" style="cursor:pointer" onclick="FTWF.review('${x.p.id}','${x.d}','${x.k}')">${v!=null?v+"%":"—"}</span>`};

/* ---------- Work hours (server) ---------- */
async function beat(){if(!ME||!TOK||isAdmin())return;try{await rpc("ft_hb",{p_token:TOK})}catch(e){}}
function slotsOf(sess,uid,nowT){const subs=allSubs().filter(x=>x.s.user_id===uid),st=new Date(sess.started_at).getTime(),ls=new Date(sess.last_seen).getTime(),live=nowT-ls<10*60e3,end=live?nowT:ls,out=[];
  for(let i=0,t=st;t<end&&i<24;i++,t+=36e5){const t2=t+36e5,items=subs.filter(x=>{const a=new Date(subAt(x.s)).getTime();return a>=t&&a<t2});out.push({i,full:t2<=end,items,label:new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" - "+new Date(t2).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})})}return {out,live,ms:end-st}}
const dur=ms=>{const m=Math.floor(ms/6e4);return `${Math.floor(m/60)}س ${m%60}د`};
function periodStats(uid){const t=today(),d=new Date(t+"T12:00:00Z"),wk=new Date(d-((d.getUTCDay()+1)%7)*864e5).toISOString().slice(0,10),mo=t.slice(0,8)+"01";const s=allSubs().filter(x=>x.s.user_id===uid);
  const c=f=>{const l=s.filter(f);return {ap:l.filter(x=>x.s.status==="approved").length,pe:l.filter(x=>!["approved","rej_emp"].includes(x.s.status)).length,rj:l.filter(x=>x.s.status==="rej_emp").length}};
  return {Daily:c(x=>x.d===t),Weekly:c(x=>x.d>=wk&&x.d<=t),Monthly:c(x=>x.d>=mo&&x.d<=t),Total:c(()=>true)}}
let HDAY=null;
VIEWS.hours=async function(){if(!isMgr())return go("dashboard");const d=HDAY||today();
  try{const r=await rpc("ft_work_get",{p_token:TOK,p_from:new Date(d+"T00:00:00+03:00").toISOString(),p_to:new Date(d+"T23:59:59+03:00").toISOString()});WORK=r.error?{sessions:[]}:r}catch(e){}
  await loadSubs();const nowT=new Date(WORK.now||Date.now()).getTime(),emps=DB.users.filter(u=>u.role!=="admin"&&u.role!=="supervisor");
  $("#main").innerHTML=header("ساعات العمل والإنجاز","متابعة مباشرة لساعات عمل الموظفين وإنجازهم",`<input type="date" value="${d}" onchange="FTWF.hday(this.value)">`)+
  emps.map(u=>{const ss=(WORK.sessions||[]).filter(s=>s.user_id===u.id).slice().reverse(),sl=ss.map(s=>slotsOf(s,u.id,nowT)),live=sl.some(x=>x.live),tot=sl.reduce((a,x)=>a+x.ms,0),ps=periodStats(u.id),cards=sl.flatMap(x=>x.out);
    return `<div class="card wh-emp"><div class="ph"><div><h3 style="margin:0">${esc(u.name)} ${live?'<span class="badge b-ok wh-live">● متصل الآن</span>':ss.length?'<span class="badge b-mut">غير متصل</span>':'<span class="badge b-bad">لم يسجّل دخول</span>'}</h3><small style="color:var(--muted)">${esc(FTHierarchy.roles[u.role]||"")} ${ss.length?"· أول دخول "+fmtAt(ss[0].started_at)+" · مدة العمل "+dur(tot):""}</small></div>
    <div class="wh-per">${["Daily","Weekly","Monthly","Total"].map(k=>`<div><b class="en">${k}</b><span>✓${ps[k].ap} ⏳${ps[k].pe} ✕${ps[k].rj}</span></div>`).join("")}</div></div>
    <div class="wh-grid">${cards.map(h=>`<div class="wh-card ${h.items.length?"ok":h.full?"empty-h":"live"}"><div class="en"><b>${h.label}</b></div><div>${h.items.length?`✅ ${h.items.length} مهمة`:h.full?"⚠️ ساعة فارغة":"⏱ جارية"}</div>${h.items.map(x=>`<a onclick="FTWF.review('${x.p.id}','${x.d}','${x.k}')">• ${esc(TNAME(x.k))} — ${esc(x.p.client)} <span class="badge ${STG[x.s.status]?.[1]}">${STG[x.s.status]?.[0]}</span></a>`).join("")}</div>`).join("")||'<div class="empty">لا توجد ساعات عمل لهذا اليوم</div>'}</div></div>`}).join("")};

VIEWS.approvals=async function(){await loadSubs();const mine=allSubs().filter(x=>canAct(x.s)),own=allSubs().filter(x=>x.s.user_id===ME.id),all=isMgr()?allSubs():[];

  const tbl=(l,e)=>l.length?`<div class="tbl"><table><thead><tr><th>التاريخ</th><th>المشروع</th><th>المهمة</th><th>الموظف</th><th>الحالة</th><th>التقييم</th></tr></thead><tbody>${l.sort((a,b)=>(b.s.updated_at||"").localeCompare(a.s.updated_at||"")).map(row).join("")}</tbody></table></div>`:`<div class="empty">${e}</div>`;

  `<div class="card" style="margin-top:16px"><h3 style="margin-top:0">📁 مهامي المرفوعة</h3>${tbl(own,"لم ترفع أي مهمة بعد")}</div>`+
  (isMgr()?`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">كل المهام</h3>${tbl(all,"لا يوجد")}</div>`:"")};

let EVD=null,EVM=null;
VIEWS.evaluation=async function(){if(!isMgr())return go("dashboard");await loadSubs();const m=EVM||today().slice(0,7),d=EVD;const emps=DB.users.filter(u=>u.role!=="admin"&&u.role!=="supervisor");
  const rank=f=>emps.map(u=>{const l=allSubs().filter(x=>x.s.user_id===u.id&&x.s.status==="approved"&&f(x.d)),sc=l.map(x=>score(x.s)).filter(v=>v!=null);return {u,n:l.length,avg:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0,rated:sc.length}}).sort((a,b)=>b.avg-a.avg||b.n-a.n);
  const mr=rank(x=>x.startsWith(m)),star=mr.find(x=>x.rated),dr=d?rank(x=>x===d):mr;
  $("#main").innerHTML=header("تقييم الموظفين","ترتيب الموظفين حسب تقييم مهامهم المعتمدة",`<input type="month" value="${m}" onchange="FTWF.evm(this.value)"><input type="date" value="${d||""}" onchange="FTWF.evd(this.value)" title="يوم محدد">${d?`<button class="btn sm" onclick="FTWF.evd('')">كل الشهر</button>`:""}`)+
  (star?`<div class="eom"><div class="eom-glow"></div><div class="eom-crown">👑</div><div class="eom-t">موظف الشهر · <span class="en">${m}</span></div><div class="eom-n">${esc(star.u.name)}</div><div class="eom-s"><b>${star.avg}%</b> متوسط التقييم · ${star.n} مهمة معتمدة</div></div>`:"")+
  `<div class="card tbl" style="margin-top:16px"><h3 style="margin:0 0 10px">الترتيب ${d?"ليوم "+d:"لشهر "+m}</h3><table><thead><tr><th>#</th><th>الموظف</th><th>مهام معتمدة</th><th>مقيّمة</th><th>التقييم</th></tr></thead><tbody>${dr.map((x,i)=>`<tr class="${star&&x.u.id===star.u.id&&!d?"eom-row":""}"><td>${i+1}</td><td><b>${esc(x.u.name)}</b></td><td>${x.n}</td><td>${x.rated}</td><td><div class="bar" style="min-width:120px"><i style="width:${x.avg}%"></i></div><b>${x.avg}%</b></td></tr>`).join("")}</tbody></table></div>`};

/* ---------- Smart auto task distribution (by specialty + plan) ---------- */
const FTAUTO=(()=>{
 const SPEC={stories:["marketing"],posts:["marketing"],reels:["photography"],design:["design"],ads:["marketing"],content:["marketing","photography"]};
 const ADS_RX=/ads|ad |media|إعلان|اعلان|ميديا/i;
 const active=()=>DB.projects.filter(p=>p.status!=="completed");
 function load(uid,skip){let n=0;active().forEach(p=>{if(p.id===skip)return;TASKS.forEach(([k])=>{if(p.assign?.[k]===uid)n+=+(p.targets?.[k]||0)})});return n}
 function avg(uid){const a=[];DB.projects.forEach(p=>{const t=DB.tracker[p.id]||{};Object.entries(p.taskRatings||{}).forEach(([key,o])=>{const [d,k]=key.split("|");if(o.s&&t[d]?.by?.[k]===uid)a.push(o.s)})});return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
 function eligible(k){return DB.users.filter(u=>!u.disabled&&u.role!=="admin")}
 function pick(k,p,pool){let c=eligible(k);if(pool.length){const inPool=c.filter(u=>pool.includes(u.id));if(inPool.length)c=inPool}
  if(k==="ads"){const ad=c.filter(u=>ADS_RX.test(u.title||""));if(ad.length)c=ad}
  if(!c.length)return null;
  const prev=DB.projects.filter(x=>x.id!==p.id&&x.client===p.client).map(x=>x.assign?.[k]);
  c.sort((a,b)=>load(a.id,p.id)-load(b.id,p.id)||avg(b.id)-avg(a.id)||(prev.includes(b.id)?1:0)-(prev.includes(a.id)?1:0));
  return c[0].id}
 function distribute(p,pool){const out={};TASKS.forEach(([k])=>{if(!(+(p.targets?.[k]||0)))return;const id=pick(k,p,pool||[]);if(id)out[k]=id});return out}
 const owner=(pid,k)=>DB.projects.find(x=>x.id===pid)?.assign?.[k]||null;
 const canDo=(pid,k)=>{const o=owner(pid,k);return !o||o===ME.id||canEditCreds()};
 function notifyAssign(p,assign,old){const by={};Object.entries(assign).forEach(([k,u])=>{if(old?.[k]===u)return;(by[u]=by[u]||[]).push(TNAME(k)+" ("+(p.targets?.[k]||0)+")")});Object.entries(by).forEach(([u,l])=>notify([u],"task","🎯 مهام جديدة مسندة إليك: "+p.client,"الباقة "+p.plan+" — "+l.join("، "),"projects/"+p.id))}
 return {SPEC,distribute,owner,canDo,load,notifyAssign,eligible};
})();

(function(root){
 const SPEC={stories:['marketing'],posts:['marketing'],reels:['photography'],design:['design'],ads:['marketing'],content:['marketing','photography']};
 const leads={marketing_lead:['marketing','design'],photography_lead:['photography'],it_lead:['it']};
 const manager=a=>Boolean(a&&['admin','supervisor'].includes(a.role));
 const isLead=a=>Boolean(a&&(manager(a)||leads[a.role]));
 function team(a,users){const base=(users||[]).filter(u=>!u.disabled&&u.role!=='admin');if(!a)return[];if(manager(a))return base;const depts=leads[a.role];return depts?base.filter(u=>depts.includes(u.department)):[]}
 function canView(a,p,users){return Boolean(a&&p&&(isLead(a)||(p.members||[]).includes(a.id)||(leads[a.role]&&team(a,users).some(u=>(p.members||[]).includes(u.id)||Object.values(p.assign||{}).includes(u.id))))) }
 function canAssign(a,p,k,users){return Boolean(isLead(a)&&p&&p.status!=='completed')}
 function candidates(a,k,users){return team(a,users)}
 function valid(a,p,k,id,users){return canAssign(a,p,k,users)&&Boolean(id&&candidates(a,k,users).some(u=>u.id===id))}
 root.FTTeamPolicy={team,canView,canAssign,candidates,valid,manager};
})(typeof window==='undefined'?globalThis:window);

<script>

(function(){
 const SBN=()=>supabase.createClient("https://lsuxtbimioljbdpfswbm.supabase.co","sb_publishable_sI9JJuvg0DbfZixDmjtpMA_1R55fy1X",{auth:{persistSession:false},global:{headers:{"x-ft-token":TOK}}});

<script>
/* ===== Multiple employees per marketing task (Stories, Posts, Reels, Design, Ads) =====
   p.assign[k] stays the primary employee (kept for compatibility); p.assignX[k] holds the extra employees. */
(function(){
 const T=(ar,en)=>LANG==="en"?en:ar;
 const list=(p,k)=>[...new Set([p?.assign?.[k],...((p?.assignX||{})[k]||[])].filter(Boolean))];
 const nm=id=>DB.users.find(u=>u.id===id)?.name||"?";
 const canEdit=(p,k)=>(typeof canEditCreds==="function"&&canEditCreds())||FTTeam.canAssign(p,k);
 function pool(p,k){const c=(typeof canEditCreds==="function"&&canEditCreds())?FTAUTO.eligible(k):FTTeam.candidates(k);const ids=new Set(c.map(u=>u.id));list(p,k).forEach(id=>{if(!ids.has(id)){const u=DB.users.find(x=>x.id===id);if(u)c.push(u)}});return c}
 FTAUTO.owners=list;
 FTAUTO.canDo=(pid,k)=>{const l=list(DB.projects.find(x=>x.id===pid),k);return !l.length||l.includes(ME.id)||(typeof canEditCreds==="function"&&canEditCreds())};
 function open(pid,only){const p=DB.projects.find(x=>x.id===pid);if(!p)return;const tasks=TASKS.filter(([k])=>(!only||k===only)&&canEdit(p,k));
  if(!tasks.length)return toast(T("لا توجد مهام يمكنك توزيعها في هذا المشروع","No tasks you can assign in this project"));
  modal(`<h3 style="margin-top:0">👥 ${T("توزيع المهام","Assign tasks")} — ${esc(p.client)}</h3><p style="color:var(--muted);font-size:13px;margin-top:-4px">${T("يمكنك اختيار أكثر من موظف لكل مهمة","You can choose more than one employee for each task")}</p>
  <div style="display:grid;gap:14px;max-height:60vh;overflow:auto;padding-inline-end:4px">${tasks.map(([k])=>{const sel=list(p,k),c=pool(p,k);return `<div data-mk="${k}" style="border:1px solid var(--line);border-radius:12px;padding:12px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px"><b>${esc(TNAME(k))}</b><label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-size:12px;color:var(--muted)">${T("العدد المطلوب","Quantity")}<input type="number" min="0" data-qty="${k}" value="${+(p.targets?.[k]||0)}" style="width:70px;margin:0"></label></div><div style="display:flex;flex-wrap:wrap;gap:6px">${c.map(u=>`<label style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;font-size:13px;margin:0"><input type="checkbox" value="${u.id}" ${sel.includes(u.id)?"checked":""} style="width:auto;margin:0">${esc(u.name)}</label>`).join("")||`<small style="color:var(--muted)">${T("لا يوجد موظفون","No employees")}</small>`}</div></div>`}).join("")}</div>
  <div id="mtErr" style="color:var(--bad);font-size:13px;min-height:18px;margin-top:8px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">${T("إلغاء","Cancel")}</button><button class="btn primary" id="mtSave">${T("حفظ التوزيع","Save assignments")}</button></div>`);
  $("#mtSave").onclick=async()=>{
   /* FIX: read selections from the form first (never mutate the stale "p" captured when the modal opened) */
   const sel={},qty={};
   document.querySelectorAll("[data-qty]").forEach(i=>{qty[i.dataset.qty]=Math.max(0,+i.value||0)});
   document.querySelectorAll("[data-mk]").forEach(b=>{sel[b.dataset.mk]=[...b.querySelectorAll("input:checked")].map(i=>i.value)});
   const btn=$("#mtSave");btn.disabled=true;btn.textContent=T("جارٍ الحفظ…","Saving…");
   const r=await FTMT.commit(pid,sel,qty);
   if(r.ok){closeModal();toast(T("تم حفظ التوزيع ✓","Assignments saved ✓"));rerender()}
   else if($("#mtSave")){btn.disabled=false;btn.textContent=T("حفظ التوزيع","Save assignments");$("#mtErr").textContent=r.msg}
  }}
 /* FIX: robust save — fetch latest data, apply changes to the fresh project object, save, then verify on the server copy */
 let busySave=false;
 async function commit(pid,sel,qty){
  if(busySave)return{ok:false,msg:T("جارٍ حفظ عملية سابقة…","A previous save is in progress…")};
  if(!TOK)return{ok:false,msg:T("انتهت الجلسة، سجّل الدخول مجدداً","Session expired, sign in again")};
  busySave=true;
  try{
   const latest=await rpc("ft_get",{p_token:TOK});if(!apply(latest))throw new Error("read");
   const p=DB.projects.find(x=>x.id===pid);if(!p)throw new Error("gone");
   const keys=Object.keys(sel);
   if(keys.some(k=>!canEdit(p,k)))throw new Error("perm");
   const allowed=k=>new Set(pool(p,k).map(u=>u.id));
   if(keys.some(k=>{const a=allowed(k);return sel[k].some(id=>!a.has(id))}))throw new Error("perm");
   const old={};keys.forEach(k=>old[k]=list(p,k));
   p.assign={...(p.assign||{})};p.assignX={...(p.assignX||{})};p.targets={...(p.targets||{})};p.members=[...(p.members||[])];
   Object.entries(qty||{}).forEach(([k,v])=>{p.targets[k]=v});
   keys.forEach(k=>{const ids=[...new Set(sel[k])];
    if(!ids.length){delete p.assign[k];delete p.assignX[k];return}
    const primary=ids.includes(p.assign[k])?p.assign[k]:ids[0];p.assign[k]=primary;
    const extra=ids.filter(x=>x!==primary);if(extra.length)p.assignX[k]=extra;else delete p.assignX[k];
    ids.forEach(id=>{if(!p.members.includes(id))p.members.push(id)})});
   const want={};keys.forEach(k=>want[k]=list(p,k).slice().sort().join(","));
   const res=await rpc("ft_save",{p_token:TOK,p_data:DB,p_scope:{meta:true}});
   if(!res||res.error||!apply(res))throw new Error("save");
   const saved=DB.projects.find(x=>x.id===pid);
   if(!saved||keys.some(k=>list(saved,k).slice().sort().join(",")!==want[k]))throw new Error("rejected");
   const by={};keys.forEach(k=>list(saved,k).filter(u=>!old[k].includes(u)&&u!==ME.id).forEach(u=>(by[u]=by[u]||[]).push(TNAME(k)+" ("+(saved.targets?.[k]||0)+")")));
   Object.entries(by).forEach(([u,l])=>notify([u],"task","🎯 مهام جديدة مسندة إليك: "+saved.client,"الباقة "+saved.plan+" — "+l.join("، "),"projects/"+saved.id));
   return{ok:true};
  }catch(e){
   try{const l=await rpc("ft_get",{p_token:TOK});apply(l)}catch(_){}
   const m=e&&e.message;
   return{ok:false,msg:m==="perm"?T("لا تملك صلاحية إسناد هذه المهمة لهذا الموظف","You can't assign this task to this employee"):m==="gone"?T("المشروع لم يعد موجوداً","Project no longer exists"):m==="rejected"?T("رفض الخادم حفظ التوزيع؛ تحقق من صلاحياتك","The server rejected the assignment; check your permissions"):T("تعذّر الحفظ؛ تحقق من الاتصال وأعد المحاولة","Couldn't save; check the connection and retry")};
  }finally{busySave=false}
 }
 window.FTMT={open,list,commit};
 FTTeam.open=pid=>open(pid);
 /* FIX: inline dropdown reassignment (tracker table) uses the same verified save */
 window.reassignTask=async function(pid,k,id){const r=await commit(pid,{[k]:id?[id]:[]});toast(r.ok?T("تم نقل المهمة ✓","Task reassigned ✓"):r.msg);rerender()};
 /* team assignment board: show every employee on each task */
 const NAMES=()=>Object.fromEntries(TASKS.map(([k])=>[TNAME(k),k]));
 const _board=VIEWS.assignments;VIEWS.assignments=FTTeam.board=function(...a){const r=_board.apply(this,a);const map=NAMES();
  document.querySelectorAll(".ta-table tbody tr").forEach(tr=>{const b=tr.querySelector("button[onclick*='FTTeam.open']"),td=tr.children;if(!b||td.length<4)return;const pid=(b.getAttribute("onclick").match(/'([^']+)'/)||[])[1],k=map[td[2].textContent.trim()],p=DB.projects.find(x=>x.id===pid);if(!p||!k)return;
   const l=list(p,k);td[3].innerHTML=l.length?l.map(id=>`<span class="badge b-mut" style="margin:2px">${esc(nm(id))}</span>`).join(""):T("غير مسندة","Unassigned")});
  const ef=$("#taEmployee")?.value;if(ef)document.querySelectorAll(".ta-table tbody tr").forEach(tr=>{if(tr.children[3]&&!tr.children[3].textContent.includes(nm(ef)))tr.remove()});
  return r};
 /* project tracker: owner row lists all employees + manage button */
 const _tv=window.trackerView;window.trackerView=function(id){_tv(id);const p=DB.projects.find(x=>x.id===id);const row=document.querySelector(".trk tr.owner");if(!p||!row)return;
  TASKS.forEach(([k],i)=>{const td=row.children[i+2];if(!td)return;const l=list(p,k),edit=canEdit(p,k);
   td.innerHTML=`<div style="display:flex;flex-direction:column;gap:3px;align-items:center">${l.map(u=>`<span class="${u===ME.id?"mine":""}" style="white-space:nowrap">${u===ME.id?"⭐ "+T("أنت","You"):esc(nm(u))}</span>`).join("")||"—"}${edit?`<button class="btn sm" style="padding:2px 8px;font-size:11px" onclick="FTMT.open('${p.id}','${k}')">👥 ${l.length?T("تعديل","Edit"):T("إسناد","Assign")}</button>`:""}</div>`});
  document.querySelectorAll(".trk .cb").forEach(el=>{const m=(el.getAttribute("onclick")||"").match(/'([^']+)','([^']+)','([^']+)'/);if(m)el.classList.toggle("cb-lock",!FTAUTO.canDo(m[1],m[3]))})};
 /* workload counts all assigned employees */
 const _load=FTAUTO.load;FTAUTO.load=function(uid,skip){let n=_load(uid,skip);DB.projects.forEach(p=>{if(p.id===skip||p.status==="completed")return;TASKS.forEach(([k])=>{if((p.assignX?.[k]||[]).includes(uid))n+=+(p.targets?.[k]||0)})});return n};
})();

/* ===== Content Creator: extra task outside the plans — make sure every project has a target so it appears ===== */
(function(){
 const fix=()=>{try{(DB&&DB.users||[]).forEach(u=>{if(u.department==='marketing'&&/design|مصمم|ديزاين/i.test(u.title||''))u.department='design'});(DB&&DB.projects||[]).forEach(p=>{p.targets=p.targets||{};if(p.targets.content==null)p.targets.content=4})}catch(e){}};
 const _vp=window.visibleProjects;window.visibleProjects=function(){fix();return _vp.apply(this,arguments)};
 const _tv=window.trackerView;if(_tv)window.trackerView=function(){fix();return _tv.apply(this,arguments)};
 const _rr=window.rerender;if(_rr)window.rerender=function(){fix();return _rr.apply(this,arguments)};
 fix();
})();

/* ===== Team-lead "assign team tasks" button inside each project + employee "My tasks" page ===== */
(function(){
 const T=(ar,en)=>LANG==="en"?en:ar;
 const owners=(p,k)=>(window.FTMT?FTMT.list(p,k):[p?.assign?.[k]].filter(Boolean));
 const _tv=window.trackerView;window.trackerView=function(id){_tv.apply(this,arguments);const p=DB.projects.find(x=>x.id===id);if(!p||!FTHierarchy.canManageTeam(ME))return;
  const box=document.querySelector("#main .top > div:last-child");if(box&&!box.querySelector(".ft-assign-btn"))box.insertAdjacentHTML("afterbegin",`<button class="btn primary ft-assign-btn" onclick="FTMT.open('${p.id}')">👥 ${T("توزيع مهام الفريق","Assign team tasks")}</button>`)};
 function myItems(){const out=[];DB.projects.filter(p=>p.status!=="completed").forEach(p=>{const t=DB.tracker[p.id]||{};TASKS.forEach(([k,en,ar])=>{const g=+(p.targets?.[k]||0);if(!g||!owners(p,k).includes(ME.id))return;
   const done=countDone(t,k),mine=Object.values(t).filter(r=>r&&r[k]&&r.by?.[k]===ME.id).length,todayDone=!!(t[today()]||{})[k];out.push({p,k,en,ar,g,done,mine,left:Math.max(0,g-done),todayDone,team:owners(p,k).length})})});
  return out.sort((a,b)=>(a.p.deadline||"9999").localeCompare(b.p.deadline||"9999")||b.left-a.left)}
 VIEWS.mytasks=function(){const it=myItems(),left=it.reduce((s,x)=>s+x.left,0),done=it.reduce((s,x)=>s+x.mine,0),open=it.filter(x=>x.left>0);
  const byP={};it.forEach(x=>(byP[x.p.id]=byP[x.p.id]||[]).push(x));
  $("#main").innerHTML=header(T("مهامي","My tasks"),T("المهام المسندة إليك وما يجب عليك إنجازه","Tasks assigned to you and what you need to deliver"))+
  `<div class="grid stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px">
   <div class="card stat"><div class="n grad-text">${Object.keys(byP).length}</div><div class="l">${T("مشاريع مسندة","Assigned projects")}</div></div>
   <div class="card stat"><div class="n" style="color:var(--warn,#ffc94a)">${left}</div><div class="l">${T("متبقٍ للإنجاز","Remaining")}</div></div>
   <div class="card stat"><div class="n" style="color:var(--ok)">${done}</div><div class="l">${T("أنجزتها أنا","Done by me")}</div></div>
   <div class="card stat"><div class="n">${open.length}</div><div class="l">${T("مهام مفتوحة","Open tasks")}</div></div></div>`+
  (it.length?Object.values(byP).map(l=>{const p=l[0].p;return `<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div><h3 style="margin:0">${esc(p.client)}</h3><small style="color:var(--muted)"><span class="badge b-plan">${p.plan}</span> · Deadline: ${deadlineBadge(p)}</small></div><button class="btn primary sm" onclick="go('projects/${p.id}')">${T("فتح المشروع ←","Open project →")}</button></div>
   <div class="tbl"><table><thead><tr><th>${T("المهمة","Task")}</th><th>${T("المطلوب","Target")}</th><th>${T("المنجز","Done")}</th><th>${T("المتبقي","Remaining")}</th><th>${T("التقدم","Progress")}</th><th>${T("اليوم","Today")}</th><th>${T("الفريق","Team")}</th></tr></thead><tbody>${l.map(x=>{const pr=Math.min(100,Math.round(x.done/x.g*100));return `<tr><td><b>${esc(LANG==="en"?x.en:x.ar)}</b> <small class="en" style="color:var(--muted)">${x.en}</small></td><td class="en">${x.g}</td><td class="en">${x.done} <small style="color:var(--muted)">(${T("أنت","you")}: ${x.mine})</small></td><td class="en" style="color:${x.left?"inherit":"var(--ok)"}"><b>${x.left?x.left:"✓"}</b></td><td><div style="display:flex;gap:8px;align-items:center;min-width:110px"><div class="bar" style="flex:1"><i style="width:${pr}%"></i></div><small class="en">${pr}%</small></div></td><td>${x.todayDone?`<span class="badge b-ok">${T("تم","Done")}</span>`:`<span class="badge b-mut">—</span>`}</td><td class="en">${x.team}</td></tr>`}).join("")}</tbody></table></div></div>`}).join(""):`<div class="card" style="text-align:center;color:var(--muted);padding:40px">${T("لا توجد مهام مسندة إليك حالياً","No tasks are assigned to you right now")}</div>`)};
 const _nav=window.buildNav;window.buildNav=function(){_nav.apply(this,arguments);const n=$("#nav");if(!n||n.querySelector('[data-k="mytasks"]')||isAdmin())return;const cnt=myItems().filter(x=>x.left>0).length;
  const a=`<a data-k="mytasks" onclick="go('mytasks')"><span>✓</span>${T("مهامي","My tasks")}${cnt?` <b class="badge b-warn" style="margin-inline-start:auto">${cnt}</b>`:""}</a>`;const first=n.querySelector('[data-k="dashboard"]');first?first.insertAdjacentHTML("afterend",a):n.insertAdjacentHTML("afterbegin",a)};
 try{if(window.ME&&$("#nav"))buildNav()}catch(e){}
})();
</script>
</html>
